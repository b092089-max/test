<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>コイン弾きバトル</title><style>*{box-sizing:border-box}body{margin:0;background:#101b24;color:#f6f3e9;font-family:system-ui,sans-serif;text-align:center}header{padding:12px 8px 4px}h1{font-size:23px;margin:0 0 5px}.sub{font-size:12px;color:#b8c8cf}.panel{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:8px}select,button{font:inherit;border:0;border-radius:9px;padding:9px 12px}button{background:#e6b84d;color:#19212a;font-weight:800}button:disabled{opacity:.45}.status{font-weight:700;min-height:25px}#board{display:block;width:min(96vw,780px);height:auto;max-height:65vh;aspect-ratio:1.5;margin:8px auto;border-radius:13px;touch-action:none;box-shadow:0 10px 40px #0008;background:#304e46}.players{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto;max-width:850px}.player{padding:7px 11px;border:2px solid #46525d;border-radius:10px;background:#202d36;font-size:13px}.player.active{border-color:#ffe080}.player.out{opacity:.35}.help{font-size:13px;color:#b8c8cf;line-height:1.7;padding:0 12px 20px}label{font-size:13px}#power{font-weight:bold;color:#ffe080}</style></head><body><header><h1>🪙 コイン弾きバトル</h1><div class="sub">相手のコインを机から落として最後まで生き残ろう！</div></header><div class="panel"><label>参加人数 <select id="count"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><button id="restart">ゲーム開始 / リセット</button></div><div class="status" id="status"></div><canvas id="board" width="900" height="600"></canvas><div id="power">力加減：—</div><div class="players" id="players"></div><div class="help">自分のコインをタッチして、<b>弾きたい方向と逆向き</b>に引っ張って離すと発射！<br>長く引くほど強く弾けます。コインが落ちたら残りのコインを自動で投入します。<br>各自3枚。最後の1人が勝利！</div><script>
(()=>{'use strict';const c=document.querySelector('#board'),ctx=c.getContext('2d'),status=document.querySelector('#status'),playersEl=document.querySelector('#players'),powerEl=document.querySelector('#power');const W=c.width,H=c.height,R=22,margin=R+3,colors=['#e5b94c','#70c8f1','#f18b92','#9de19c','#cba2f7','#f4a768'];let ps=[],coins=[],turn=0,aim=null,animating=false,finished=false,last=0,quiet=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function fresh(){const n=+document.querySelector('#count').value;ps=Array.from({length:n},(_,i)=>({id:i,stock:2,alive:true}));coins=[];turn=0;aim=null;animating=false;finished=false;quiet=0;for(let i=0;i<n;i++)spawn(i);renderUI();draw()}function spawn(i){let x,y,ok=false;const n=ps.length;for(let k=0;k<200;k++){const a=(i/n)*Math.PI*2-Math.PI/2+(k?Math.random()*.45-.225:0),d=Math.min(W,H)*.30+(k?Math.random()*90-45:0);x=W/2+Math.cos(a)*d;y=H/2+Math.sin(a)*d; x=clamp(x,margin+5,W-margin-5);y=clamp(y,margin+5,H-margin-5);if(coins.every(o=>Math.hypot(o.x-x,o.y-y)>R*2+8)){ok=true;break}}if(!ok){for(let yy=margin+5;yy<H-margin;yy+=R*3){for(let xx=margin+5;xx<W-margin;xx+=R*3){if(coins.every(o=>Math.hypot(o.x-xx,o.y-yy)>R*2+8)){x=xx;y=yy;ok=true;break}}if(ok)break}}if(ok)coins.push({id:i,x,y,vx:0,vy:0})}function renderUI(){playersEl.innerHTML=ps.map(p=>`<div class="player ${p.id===turn&&!finished?'active':''} ${!p.alive?'out':''}" style="border-color:${p.id===turn&&!finished?colors[p.id]:''}">P${p.id+1}　🪙 ${p.alive?`${p.stock+1}枚残り`:'脱落'}</div>`).join('');const alive=ps.filter(p=>p.alive);status.textContent=finished?`🏆 プレイヤー${alive[0]?.id+1??'?'}の勝利！`:animating?'コインが動いています…':`プレイヤー${turn+1}の番：コインを引っ張って弾こう`;powerEl.textContent=aim?`力加減：${Math.round(clamp(Math.hypot(aim.dx,aim.dy)/160,0,1)*100)}%`:'力加減：—'}function next(){const alive=ps.filter(p=>p.alive);if(alive.length<=1){finished=true;renderUI();return}for(let k=1;k<=ps.length;k++){const id=(turn+k)%ps.length;if(ps[id].alive){turn=id;break}}renderUI()}function resolve(){let lost=[];coins=coins.filter(o=>{if(o.x < -R*.25||o.x>W+R*.25||o.y < -R*.25||o.y>H+R*.25){lost.push(o.id);return false}return true});for(const id of lost){const p=ps[id];if(p.stock>0){p.stock--;spawn(id)}else p.alive=false}if(lost.length)renderUI()}function simulate(dt){const steps=Math.max(1,Math.ceil(dt/0.012)),h=dt/steps;for(let s=0;s<steps;s++){for(const o of coins){o.x+=o.vx*h;o.y+=o.vy*h;const f=Math.exp(-2.3*h);o.vx*=f;o.vy*=f;if(Math.hypot(o.vx,o.vy)<4){o.vx=0;o.vy=0}}for(let i=0;i<coins.length;i++)for(let j=i+1;j<coins.length;j++){let a=coins[i],b=coins[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<2*R){if(d<.001){dx=1;dy=0;d=1}const nx=dx/d,ny=dy/d,over=2*R-d;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-(1+.87)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}}resolve()}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#2e5446';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b98e56';ctx.lineWidth=17;ctx.strokeRect(8,8,W-16,H-16);ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;for(let x=100;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,18);ctx.lineTo(x,H-18);ctx.stroke()}for(let y=100;y<H;y+=100){ctx.beginPath();ctx.moveTo(18,y);ctx.lineTo(W-18,y);ctx.stroke()}for(const o of coins){ctx.beginPath();ctx.ellipse(o.x+4,o.y+5,R+1,R+1,0,0,Math.PI*2);ctx.fillStyle='#0006';ctx.fill();const grad=ctx.createRadialGradient(o.x-8,o.y-9,2,o.x,o.y,R);grad.addColorStop(0,'#fff7db');grad.addColorStop(.4,colors[o.id]);grad.addColorStop(1,'#564a36');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(o.x,o.y,R,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#17272e';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.id+1,o.x,o.y+1);if(!animating&&!finished&&o.id===turn){ctx.strokeStyle='#fff3a4';ctx.lineWidth=4;ctx.beginPath();ctx.arc(o.x,o.y,R+6,0,Math.PI*2);ctx.stroke()}}if(aim){const o=coins.find(o=>o.id===turn);if(o){const len=Math.hypot(aim.dx,aim.dy),ratio=clamp(len/160,0,1),ex=o.x-aim.dx*1.35,ey=o.y-aim.dy*1.35;ctx.strokeStyle='#fff2a4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(ex,ey);ctx.stroke();const angle=Math.atan2(-aim.dy,-aim.dx);ctx.fillStyle='#fff2a4';ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-17*Math.cos(angle-.45),ey-17*Math.sin(angle-.45));ctx.lineTo(ex-17*Math.cos(angle+.45),ey-17*Math.sin(angle+.45));ctx.fill();ctx.fillStyle='#18242a';ctx.fillRect(25,H-45,200,17);ctx.fillStyle=ratio>.75?'#f38970':'#e6c65e';ctx.fillRect(25,H-45,200*ratio,17)}}}function coords(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointerdown',e=>{if(animating||finished)return;const p=coords(e),o=coins.find(o=>o.id===turn);if(!o||Math.hypot(p.x-o.x,p.y-o.y)>R+35)return;aim={dx:0,dy:0};c.setPointerCapture(e.pointerId);e.preventDefault();renderUI()});c.addEventListener('pointermove',e=>{if(!aim)return;const p=coords(e),o=coins.find(o=>o.id===turn);if(!o)return;aim.dx=clamp(p.x-o.x,-220,220);aim.dy=clamp(p.y-o.y,-220,220);renderUI();draw()});function release(e){if(!aim)return;const o=coins.find(o=>o.id===turn);const a=aim;aim=null;if(o&&Math.hypot(a.dx,a.dy)>9){const len=Math.hypot(a.dx,a.dy),speed=Math.min(len,160)*5.3;o.vx=-a.dx/len*speed;o.vy=-a.dy/len*speed;animating=true;quiet=0}renderUI()}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',()=>{aim=null;renderUI()});function loop(t){const dt=Math.min((t-last)/1000||.016,.035);last=t;if(animating){simulate(dt);if(coins.every(o=>Math.hypot(o.vx,o.vy)<5))quiet+=dt;else quiet=0;if(quiet>.23){animating=false;for(const o of coins){o.vx=0;o.vy=0}if(ps.filter(p=>p.alive).length<=1){finished=true;renderUI()}else next()}}draw();requestAnimationFrame(loop)}document.querySelector('#restart').addEventListener('click',fresh);fresh();requestAnimationFrame(loop)})();
</script></body></html>
