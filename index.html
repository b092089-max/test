<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数式モンスターファーム</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f4f4e8;background:#101e2a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#102739,#213b32);min-height:100vh}header{background:#10202adf;padding:15px max(14px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #b4a064}h1{font-size:clamp(19px,3vw,28px);margin:0;color:#ffe7a2}h2{font-size:20px;margin:0 0 14px;color:#ffe7a2}h3{margin:6px 0}.wrap{max-width:1080px;margin:auto;padding:18px 14px 60px}.panel{background:#172c36ee;border:1px solid #48636b;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px #07121b40}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#b6c9c8}.small{font-size:13px}.pill{background:#365a59;border-radius:30px;padding:5px 11px;display:inline-block;font-size:13px}button,input,select{font:inherit}button{background:#e5bb64;color:#202a2a;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:750;transition:.15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#3a5965;color:white}.danger{background:#b85755;color:white}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{text-align:left;min-height:77px}.action span{display:block;font-weight:400;font-size:12px;opacity:.83;margin-top:4px}input,select{background:#f7f5e9;color:#1b2930;border:2px solid #b8bfae;border-radius:9px;padding:12px;width:100%;margin:6px 0 12px}label{display:block;font-weight:700}.stat{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:14px}.track{height:11px;border-radius:10px;background:#30444b;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5bb8b0,#d6dc84)}.monster{font-size:110px;text-align:center;filter:drop-shadow(0 12px 5px #09151a88);line-height:1.35;animation:bob 2.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.ranch{background:radial-gradient(ellipse at 50% 110%,#55794a 0%,#345849 48%,#213b4a 90%);border-radius:15px;padding:20px 10px 12px;min-height:185px;text-align:center}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid #4b6870;border-radius:12px;padding:12px;cursor:pointer;text-align:center;background:#233c46}.choice.active{border-color:#ffe7a2;background:#405c53}.choice .emoji{font-size:43px}.log{max-height:175px;overflow:auto;font-size:13px;color:#d5e2df}.log p{border-bottom:1px solid #344d56;padding-bottom:8px}.overlay{position:fixed;inset:0;background:#06131ce9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{width:min(100%,560px);max-height:94vh;overflow:auto;background:#203943;border:2px solid #d7b971;border-radius:20px;padding:25px;box-shadow:0 20px 90px #000a}.question{font-size:clamp(25px,5vw,40px);text-align:center;margin:22px 0;font-weight:800;color:#fff0bc}.notice{padding:12px;background:#334b50;border-radius:10px;margin:12px 0;white-space:pre-wrap}.hidden{display:none!important}.topbuttons{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;color:#9cb7b7;font-size:12px;padding:15px}@media(max-width:740px){.grid{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}.monster{font-size:90px}header{align-items:flex-start;flex-direction:column}.panel{padding:14px}}
</style><style>
.battlebar{height:12px;background:#30444b;border-radius:12px;overflow:hidden;margin:6px 0}.battlebar>div{height:100%;background:#64c69b}.battlebar.enemy>div{background:#e37d6b}.arena{background:linear-gradient(#294653,#274c3d);border-radius:14px;padding:16px;text-align:center}.fighters{display:flex;justify-content:space-around;font-size:76px}.battlebuttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.battlebuttons button{font-size:14px}.battlefeed{max-height:110px;overflow:auto;font-size:13px;background:#142b35;padding:10px;border-radius:8px}.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rankline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;padding:10px;background:#25424b;border-radius:9px}.modal.wide{width:min(100%,740px)}
.skill-type{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:800;margin:4px 0}.skill-power{background:#8e4038;color:#fff0e9}.skill-wisdom{background:#255e93;color:#e9f7ff}.battlebuttons button{line-height:1.4}</style></head><body><header><h1>✦ 数式モンスターファーム</h1><div class="topbuttons"><button class="secondary" onclick="save(true)">保存</button><button class="secondary" onclick="exportSave()">バックアップ</button><button class="secondary" onclick="document.getElementById('importFile').click()">読込</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importSave(event)"></div></header><main class="wrap"><div id="app"></div></main><footer>ブラウザに自動保存されます。バックアップファイルも定期的に保存してください。</footer><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>
'use strict';const KEY='mathMonsterFarm.phase1.v1';const species=[{id:'flare',name:'フレアドラゴン',icon:'🐲',type:'ちから型',growth:[1.1,1.35,.65,.9,.85,1],life:180},{id:'aqua',name:'アクアドラゴン',icon:'🐉',type:'かしこさ型',growth:[1, .75,1.4,1.1,.95,.8],life:192},{id:'rock',name:'ロックゴーレム',icon:'🗿',type:'丈夫さ型',growth:[1.2,1.15,.65,.7,.55,1.5],life:205},{id:'leaf',name:'リーフィー',icon:'🌱',type:'長寿型',growth:[1.2,.7,1.2,.95,1.1,.9],life:230},{id:'ghost',name:'ファントム',icon:'👻',type:'回避型',growth:[.7,.75,1.25,1.2,1.5,.55],life:185},{id:'bolt',name:'ボルトフォックス',icon:'🦊',type:'命中型',growth:[.9,1.05,1,1.5,1.3,.65],life:180}];const names=['ライフ','ちから','かしこさ','命中','回避','丈夫さ'];const jobs=[{name:'走り込み',stat:0,stress:4,fatigue:10,desc:'ライフを伸ばす軽仕事'},{name:'重り運び',stat:1,stress:5,fatigue:12,desc:'ちからを伸ばす軽仕事'},{name:'数学研究',stat:2,stress:4,fatigue:10,desc:'かしこさを伸ばす軽仕事'},{name:'的当て',stat:3,stress:5,fatigue:11,desc:'命中を伸ばす軽仕事'},{name:'障害物回避',stat:4,stress:5,fatigue:11,desc:'回避を伸ばす軽仕事'},{name:'岩運び',stat:5,stress:6,fatigue:12,desc:'丈夫さを伸ばす軽仕事'},{name:'高速計算',stat:3,other:2,heavy:true,stress:13,fatigue:23,desc:'命中・かしこさを大きく伸ばす'},{name:'数式特訓',stat:2,other:1,heavy:true,stress:14,fatigue:25,desc:'かしこさ・ちからを大きく伸ばす'},{name:'高速障害物訓練',stat:4,other:3,heavy:true,stress:14,fatigue:25,desc:'回避を大きく・命中も伸ばす重仕事'},{name:'鉄壁防御訓練',stat:5,other:0,heavy:true,stress:15,fatigue:26,desc:'丈夫さを大きく・ライフも伸ばす重仕事'}];let state=null;let pending=null;let selected=0;let question=null;let locked=false;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(x,a,b){return Math.min(b,Math.max(a,x))}function spec(m){return species.find(s=>s.id===m.species)||species[0]}function growthAptitude(m){const main=spec(m).growth;const sub=species.find(s=>s.id===m.subSpecies);return sub?main.map((v,i)=>v*.8+sub.growth[i]*.2):main}function growthAptitudeForFusion(a,b){return spec(a).growth.map((v,i)=>v*.8+spec(b).growth[i]*.2)}function yearWeek(w){return `${Math.floor(w/48)+1}年 ${Math.floor((w%48)/4)+1}月 第${w%4+1}週`}function stage(m){let r=m.age/m.lifespan;return r<.15?'幼年期':r<.35?'成長期':r<.65?'最盛期':r<.82?'成熟期':'晩年期'}function condition(m){const burden=Math.max(m.fatigue,m.stress)*.65+(m.fatigue+m.stress)*.175;return burden>=85?'危険':burden>=65?'要休養':burden>=40?'やや疲れ':'元気'}function growth(m){let r=m.age/m.lifespan;return r<.15?.55:r<.35?1:r<.65?1.5:r<.82?.9:.5}function log(t){state.logs.unshift(`${yearWeek(state.week)}：${t}`);state.logs=state.logs.slice(0,35)}function save(show=false){if(state){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)alert('保存しました。')}catch(e){alert('保存に失敗しました。バックアップを利用してください。')}}}function init(){try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&v.version===1&&Array.isArray(v.monsters)&&Number.isFinite(v.week)){state=v}}}catch(e){}render()}
function makeMonster(id,name){const s=species.find(x=>x.id===id);return {id:Date.now()+Math.random(),species:id,name:name.trim().slice(0,16)||s.name,stats:s.growth.map(x=>Math.round(65+40*x+rand(0,25))),age:0,lifespan:s.life+rand(-12,12),fatigue:0,stress:0,loyalty:55,history:[],retired:false}}function start(){let name=document.getElementById('monsterName').value;state={version:1,week:0,money:5000,monsters:[makeMonster(species[selected].id,name)],active:0,logs:[],records:[],answers:{correct:0,total:0},level:document.getElementById('level').value};log('ファームが始まりました。新しいモンスターが誕生！');save();render()}

function renderNextGoals(m){
 const total=m.stats.reduce((a,b)=>a+b,0),rank=state.battleData?.rank||0;
 const milestones=[500,1000,1500,2000,2500,3000,4000,5000];
 const target=milestones.find(v=>total<v);
 const currentRank=['E','D','C','B','A','S'][Math.min(rank,5)];
 const nextRank=['D','C','B','A','S'][rank];
 const progress=(v,max)=>`<div class="track" style="margin:7px 0 12px"><div class="fill" style="width:${Math.min(100,Math.round(v/max*100))}%"></div></div>`;
 let html='';
 if(target){html+=`<p><b>育成目標：能力合計 ${target.toLocaleString()}</b></p><p class="small muted">現在 ${total.toLocaleString()} / ${target.toLocaleString()}（あと ${(target-total).toLocaleString()}）</p>${progress(total,target)}`;}
 else {html+=`<p><b>育成目標達成！ 合計 ${total.toLocaleString()}</b></p><p class="small muted">6能力の上限999を目指そう。</p>`;}
 if(rank<5){html+=`<p><b>大会目標：${nextRank}ランク昇格</b></p><p class="small muted">現在 ${currentRank}ランク。毎月第4週の公式大会で勝利しよう。</p>`;}
 else {
  const majors=state.p4?.majors||[];
  if(majors.length<4)html+=`<p><b>大会目標：四大大会制覇 ${majors.length}/4</b></p><p class="small muted">Sランク到達！ 未制覇の四大大会に挑戦しよう。</p>${progress(majors.length,4)}`;
  else html+=`<p><b>大会目標：四大大会制覇達成！</b></p><p class="small muted">殿堂入りと次世代育成を目指そう。</p>`;
 }
 const useCount=typeof battleSkills!=='undefined'&&Array.isArray(battleSkills)?battleSkills.length:0;
 if(m.age<48)html+=`<p class="small muted">🌱 成長の序盤：仕事を通じて得意能力を見つけよう。</p>`;
 else if(m.age/m.lifespan>.75)html+=`<p class="small muted">🌙 晩年期：大会記録を残し、冬眠・合体・世代交代も検討しよう。</p>`;
 else if(total>=1500)html+=`<p class="small muted">🔥 育成の中盤：修行で技を覚え、得意距離を伸ばそう。</p>`;
 return html;
}
function render(){const app=document.getElementById('app');if(!state){app.innerHTML=`<section class="panel"><h2>モンスターを誕生させよう</h2><p class="muted">毎週1回の仕事で数学問題に挑戦。能力を伸ばしながら寿命のあるモンスターを育てよう。</p><div class="six">${species.map((s,i)=>`<div class="choice ${selected===i?'active':''}" onclick="selectSpecies(${i})"><div class="emoji">${s.icon}</div><b>${s.name}</b><div class="small muted">${s.type}</div></div>`).join('')}</div><p><label for="monsterName">モンスターの名前</label><input id="monsterName" maxlength="16" placeholder="名前を入力（省略可）"></p><label for="level">数学の難易度</label><select id="level"><option value="elementary">小学生</option><option value="junior" selected>中学生</option><option value="high">高校生</option></select><button onclick="start()" style="width:100%">育成をはじめる</button></section>`;return}const m=state.monsters[state.active];if(!m){app.innerHTML=`<div class="panel"><h2>育成するモンスターがいません</h2><p>次のモンスターを迎えて、新しい世代の育成を始めましょう。</p><button onclick="newMonster()">新しいモンスターを迎える</button></div><div class="panel"><h2>育成記録</h2>${state.records.map(r=>`<p>${safe(r.name)} / ${safe(r.species)} / ${r.age}週 / 合計能力 ${r.total}</p>`).join('')||'まだ記録がありません'}</div>`;return}const s=spec(m);app.innerHTML=`<div class="grid"><div><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="pill">📅 ${yearWeek(state.week)}</span><span class="pill">💰 ${state.money.toLocaleString()} G</span></div><div class="ranch"><div class="monster">${s.icon}</div><h2 style="margin:0">${safe(m.name)}</h2><span class="small">${s.name} / ${stage(m)}</span></div><p class="small muted">年齢：${Math.floor(m.age/48)}歳 ${Math.floor(m.age%48/4)}か月 / 忠誠度 ${m.loyalty}</p>${names.map((n,i)=>`<div class="stat"><span>${n}</span><div class="track"><div class="fill" style="width:${m.stats[i]/999*100}%"></div></div><b>${m.stats[i]}</b></div>`).join('')}<div class="small muted">体調：<b>${condition(m)}</b>　疲労 ${m.fatigue}/100　ストレス ${m.stress}/100</div><div class="small muted">数学の正答率 ${state.answers.total?Math.round(state.answers.correct/state.answers.total*100):0}%（${state.answers.correct}/${state.answers.total}）</div></section><section class="panel"><h2>ファームの記録</h2><div class="log">${state.logs.map(x=>`<p>${safe(x)}</p>`).join('')}</div></section></div><div><section class="panel"><h2>今週の育成</h2><p class="muted small">仕事を選ぶと数学問題が1問出題されます。正解で成長ボーナス！</p><div class="actions">${jobs.map((j,i)=>`<button class="secondary action" onclick="beginJob(${i})">${j.heavy?'🔥':'🌿'} ${j.name}<span>${j.desc} / 疲労+${j.fatigue}</span></button>`).join('')}</div></section><section class="panel"><h2>休養・生活</h2><div class="actions"><button onclick="rest()">💤 休養<span class="small" style="display:block">疲労-40、ストレス-20</span></button><button onclick="feed()">🍎 おやつ 300G<span class="small" style="display:block">ストレス-18、忠誠度+3 / 1週</span></button><button class="secondary" onclick="changeLevel()">📚 数学レベル変更</button><button class="secondary" onclick="showRecords()">🏅 育成記録</button></div><p class="small muted">行動1回で1週間経過。体調は疲労・ストレスから判定。各値が65を超えると寿命が追加減少し、86以上では減少が増えます。</p></section><section class="panel"><h2>次の目標</h2>${renderNextGoals(m)}<button class="danger" onclick="retireAsk()">モンスターを引退させる</button></section></div></div>`}
function selectSpecies(i){selected=i;const v=document.getElementById('monsterName')?.value||'';const lev=document.getElementById('level')?.value||'junior';render();document.getElementById('monsterName').value=v;document.getElementById('level').value=lev}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function makeQuestion(level){
 const r=rand, pick=a=>a[r(0,a.length-1)], signed=n=>n<0?`− ${-n}`:`+ ${n}`;
 const elementary=[
 ()=>{let a=r(10,900),b=r(10,900);return [`${a} + ${b} = ?`,a+b]},
 ()=>{let a=r(100,999),b=r(1,a);return [`${a} − ${b} = ?`,a-b]},
 ()=>{let a=r(2,19),b=r(2,19);return [`${a} × ${b} = ?`,a*b]},
 ()=>{let a=r(2,19),b=r(2,19);return [`${a*b} ÷ ${a} = ?`,b]},
 ()=>{let a=r(2,15),b=r(2,12),c=r(2,9);return [`${a} + ${b} × ${c} = ?`,a+b*c]},
 ()=>{let a=r(2,15),b=r(2,12),c=r(2,9);return [`(${a} + ${b}) × ${c} = ?`,(a+b)*c]},
 ()=>{let a=r(2,12),b=r(2,9);return [`${a}² + ${b} = ?`,a*a+b]},
 ()=>{let a=r(2,15),b=r(2,9);return [`${a*b}個を${a}人で同じ数ずつ分けると、1人何個？`,b]},
 ()=>{let a=r(2,12),b=r(2,12);return [`たて${a}cm、横${b}cmの長方形の面積は何cm²？`,a*b]},
 ()=>{let a=r(2,12),b=r(2,12);return [`たて${a}cm、横${b}cmの長方形の周りの長さは何cm？`,2*(a+b)]},
 ()=>{let a=r(2,20),b=r(2,8);return [`${a}の${b}倍はいくつ？`,a*b]},
 ()=>{let a=r(2,15),b=r(2,15);return [`${a*10}の${b*10}%はいくつ？`,a*b]}
 ];
 const junior=[
 ()=>{let a=r(-20,20),b=r(-20,20);return [`(${a}) + (${b}) = ?`,a+b]},
 ()=>{let a=r(-15,15),b=r(-15,15);return [`(${a}) × (${b}) = ?`,a*b]},
 ()=>{let x=r(-12,12),a=r(2,9),b=r(-20,20);return [`${a}x ${signed(b)} = ${a*x+b} の x = ?`,x]},
 ()=>{let x=r(-10,10),a=r(2,8),b=r(-9,9);return [`${a}(x ${signed(b)}) = ${a*(x+b)} の x = ?`,x]},
 ()=>{let a=r(2,18);return [`√${a*a} = ?`,a]},
 ()=>{let a=r(2,14),b=r(2,14);return [`${a*a} − ${b*b} = ?`,a*a-b*b]},
 ()=>{let a=r(2,12),b=r(2,12);return [`(${a} + ${b})² − (${a}² + ${b}²) = ?`,2*a*b]},
 ()=>{let x=r(-10,10),y=r(-10,10);return [`x + y = ${x+y}、x − y = ${x-y} のとき x = ?`,x]},
 ()=>{let x=r(-10,10),y=r(-10,10);return [`x + y = ${x+y}、x − y = ${x-y} のとき y = ?`,y]},
 ()=>{let a=r(2,12),b=r(2,12);return [`底辺${a}cm、高さ${2*b}cmの三角形の面積は何cm²？`,a*b]},
 ()=>{let a=r(2,10),b=r(2,10);return [`直角三角形の直角をはさむ2辺が${3*a}cmと${4*a}cm。斜辺は何cm？`,5*a]},
 ()=>{let a=r(2,12),b=r(-10,10),x=r(-5,5);return [`y = ${a}x ${signed(b)} で x = ${x} のとき y = ?`,a*x+b]},
 ()=>{let a=r(2,8),b=r(2,8);return [`(x + ${a})(x + ${b}) の x の係数は？`,a+b]},
 ()=>{let a=r(2,12);return [`${a}² の平方根のうち、正のものは？`,a]}
 ];
 const high=[
 ()=>{let a=r(-8,8),b=r(-8,8);return [`f(x)=x² ${signed(a)}x ${signed(b)} の f(2) = ?`,4+2*a+b]},
 ()=>{let a=r(1,7),b=r(-12,12);return [`y=${a}x² ${signed(b)} の最小値は？`,b]},
 ()=>{let a=r(2,12),d=r(2,12),n=r(5,15);return [`等差数列 ${a}, ${a+d}, ${a+2*d}, … の第${n}項は？`,a+(n-1)*d]},
 ()=>{let a=r(1,8),d=r(2,7),n=r(4,12);return [`初項${a}、公差${d}の等差数列の初めの${n}項の和は？`,n*(2*a+(n-1)*d)/2]},
 ()=>{let a=r(1,6),q=r(2,3),n=r(3,6);return [`初項${a}、公比${q}の等比数列の第${n}項は？`,a*q**(n-1)]},
 ()=>{let a=r(2,9),b=r(2,9);return [`(x + ${a})(x + ${b}) の定数項は？`,a*b]},
 ()=>{let a=r(2,12),b=r(2,12);return [`x² − ${a+b}x + ${a*b} = 0 の2つの解の和は？`,a+b]},
 ()=>{let a=r(2,12),b=r(2,12);return [`x² − ${a+b}x + ${a*b} = 0 の2つの解の積は？`,a*b]},
 ()=>{let a=r(2,8),b=r(-10,10),x=r(-5,5);return [`f(x)=${a}x² ${signed(b)}x の f'(${x}) = ?`,2*a*x+b]},
 ()=>{let a=r(2,8),b=r(2,9);return [`∫₀^${b} ${2*a}x dx = ?`,a*b*b]},

function beginCalendarAdventure(i,month){if(farmMonth()!==month||!adventureCalendar.some(e=>e.month===month&&e.index===i))return;beginExpedition(i)}
const calendarOldBegin=beginExpedition;
beginExpedition=function(i){const event=adventureNow();if(!event||event.index!==i){alert('この冒険は現在開催されていません。');return}calendarOldBegin(i)};
const calendarOldAdvance=advance;
advance=function(){if(!state)return;const oldMonth=farmMonth();calendarOldAdvance();if(state&&farmMonth()!==oldMonth){const e=adventureNow();if(e){log(`🗺️ ${e.title}が開催されました！ 冒険メニューから参加できます。`);save()}}};
function majorUnlocked(){ensureBattleData();return state.battleData.rank>=5 && (state.battleData.champions||[]).length>0}
function nextMajorIndex(){phase4Init();return fourMajors.findIndex(t=>!state.p4.majors.includes(t.name))}
function majorSchedule(){const i=nextMajorIndex();return i<0?'四大大会をすべて制覇しました':!majorUnlocked()?'Sランク公式大会で優勝すると四大大会が解放されます':`次の大会：${fourMajors[i].name}（${i+1}/4）`}
const originalBattlePanelCalendar=battlePanel;
battlePanel=function(){if(!state?.monsters[state.active])return '';ensureBattleData();const d=state.battleData,i=nextMajorIndex(),unlocked=majorUnlocked();return `<section class="panel"><h2>🏆 大会・数学バトル</h2><p>現在の公式ランク：<b>${ranks[d.rank]}</b>　通算 ${d.wins}勝 ${d.losses}敗</p><p class="small muted">公式大会は毎月第4週に開催。問題回答中は試合時間停止。</p><div class="rankline"><span>公式大会：${ranks[d.rank]}ランク / 賞金${prizes[d.rank].toLocaleString()}G</span><button onclick="startBattle(true)" ${availableTournament()?'':'disabled'}>大会出場</button></div>${unlocked&&i>=0?`<div class="rankline"><span>🏆 四大大会 第${i+1}戦：<b>${fourMajors[i].name}</b> / 賞金${fourMajors[i].reward.toLocaleString()}G</span><button onclick="startMajor(${i})" ${availableTournament()?'':'disabled'}>大会出場</button></div>`:''}<p class="small muted">${majorSchedule()}。四大大会は順番に1大会ずつ解放され、毎月第4週に出場できます。</p><div class="rankline"><span>練習試合：報酬なし・週経過なし</span><button class="secondary" onclick="startBattle(false)">練習バトル</button></div></section>`};
showMajors=function(){phase4Init();const i=nextMajorIndex();p4Modal('🏆 四大大会・殿堂',`<p>四大大会制覇：${state.p4.majors.length}/4　殿堂入り：${state.p4.hall.length}体</p><p>${majorSchedule()}</p><p class="small muted">四大大会への出場はファームの「🏆 大会・数学バトル」から行います。Sランクの公式大会に優勝後、順番に挑戦できます。</p>${fourMajors.map((x,j)=>`<div class="notice">${j<i||state.p4.majors.includes(x.name)?'🏅':j===i&&majorUnlocked()?'🔓':'🔒'} ${safe(x.name)} / 賞金${x.reward}G　${state.p4.majors.includes(x.name)?'制覇済み':j===i&&majorUnlocked()?'次の挑戦':'未解放'}</div>`).join('')}<h3>殿堂入り</h3>${state.p4.hall.map(x=>`<p>${safe(x.name)} / 合計能力${x.stats.reduce((a,b)=>a+b,0)}</p>`).join('')||'<p class="muted">まだいません。</p>'}`)};
const originalStartMajorCalendar=startMajor;
startMajor=function(i){if(!majorUnlocked()||i!==nextMajorIndex()||!availableTournament())return;originalStartMajorCalendar(i)};
// Major victories should not grant an extra normal S-rank prize.
const originalFinishBattleCalendar=finishBattle;
finishBattle=function(forfeit=false){if(battle&&battle.majorIndex!==undefined){const b=battle;const won=!forfeit&&(b.ehp<=0||(b.hp>0&&b.time===0&&b.hp/b.maxhp>b.ehp/b.maxehp));if(won){ // Preserve the normal finish flow but remove the ordinary S prize afterward.
 const normalPrize=prizes[b.rank]||0;originalFinishBattleCalendar(forfeit);if(state){state.money=Math.max(0,state.money-normalPrize);save()}return;
 }}return originalFinishBattleCalendar(forfeit)};

// === Cross-device exhibition battles: isolated from official records and saves ===
let qrGuest=null,qrDuel=null,qrDuelTimer=null;
function qrSelf(){return state?.monsters?.[state.active]||null}
function qrPack(m){extras(m);return {v:1,n:String(m.name).slice(0,16),s:m.species,t:(m.subSpecies||''),a:m.stats.map(x=>Math.max(1,Math.min(999,Math.round(x)))),u:(m.unlockedSkills||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<battleSkills.length).slice(0,24),e:(m.equippedSkills||[]).slice(0,3),p:String(m.personality||'').slice(0,12)}}
function qrEncode(m){return 'MFM1.'+btoa(unescape(encodeURIComponent(JSON.stringify(qrPack(m))))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function qrDecode(code){const raw=String(code||'').trim();if(!/^MFM1\.[A-Za-z0-9_-]{10,1500}$/.test(raw))throw Error('対戦コードの形式が違います');const b=raw.slice(5).replace(/-/g,'+').replace(/_/g,'/');const x=JSON.parse(decodeURIComponent(escape(atob(b))));if(x.v!==1||!Array.isArray(x.a)||x.a.length!==6||x.a.some(v=>!Number.isInteger(v)||v<1||v>999)||!species.some(s=>s.id===x.s)||!Array.isArray(x.u)||x.u.length>24||x.u.some(v=>!Number.isInteger(v)||v<0||v>=battleSkills.length))throw Error('モンスターデータが正しくありません');return {name:String(x.n||'ゲスト').slice(0,16),species:x.s,subSpecies:x.t,stats:x.a,unlockedSkills:x.u,personality:x.p||'',equippedSkills:Array.isArray(x.e)?x.e.filter(v=>Number.isInteger(v)&&v>=0&&v<battleSkills.length).slice(0,3):[]}}
function qrPanel(){if(!qrSelf())return '';return `<section class="panel"><h2>📱 別端末モンスター対戦</h2><p class="small muted">QRコード・対戦コードでモンスターを交換。AI観戦／自分で操作の2モード。育成記録や大会ランクに影響しません。</p><button onclick="qrExport()">自分の対戦QRを表示</button> <button class="secondary" onclick="qrImport()">相手を読み込む</button>${qrGuest?`<p>対戦相手：<b>${safe(qrGuest.name)}</b> (${safe(spec({species:qrGuest.species}).name)})</p><button onclick="qrStart('auto')">🤖 AI同士で対戦</button> <button onclick="qrStart('manual')">🎮 自分で操作</button>`:''}</section>`}
const qrOldRender=render;render=function(){qrOldRender();const target=document.querySelector('#app .grid>div:last-child');if(target&&qrSelf())target.insertAdjacentHTML('beforeend',qrPanel())};
function qrExport(){const m=qrSelf();if(!m)return;const code=qrEncode(m);const url='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent(code);modal(`<h2>📱 ${safe(m.name)} の対戦データ</h2><p class="small muted">通信環境があればQRを表示できます。QR画像の生成には外部サービスを使用します。コードをコピーして相手に送ることもできます。</p><img src="${url}" width="220" height="220" alt="対戦QRコード" style="display:block;margin:12px auto;background:white;padding:8px"/><textarea id="qrCodeOut" readonly rows="4" style="width:100%">${code}</textarea><button onclick="navigator.clipboard?.writeText(document.getElementById('qrCodeOut').value).then(()=>alert('コピーしました')).catch(()=>alert('テキストを長押ししてコピーしてください'))">コードをコピー</button><button class="secondary" onclick="qrImport()">相手を読み込む</button>`)}
function qrImport(){modal(`<h2>📥 対戦モンスターの読み込み</h2><p class="small muted">相手のQRを端末のカメラで読み取ってコピーしたコードを貼り付けてください。対応ブラウザでは画像からのQR解析も試せます。</p><textarea id="qrCodeIn" rows="5" style="width:100%" placeholder="MFM1. で始まる対戦コード"></textarea><p><button onclick="qrLoad()">読み込む</button></p><p><input type="file" id="qrImageIn" accept="image/*" onchange="qrReadImage(this)"></p><p class="small muted">画像読み取りはBarcodeDetector対応ブラウザのみ。非対応の場合はコードの貼り付けを利用してください。</p>`)}
async function qrReadImage(el){try{if(!('BarcodeDetector'in window))throw Error('このブラウザはQR画像解析に対応していません');const file=el.files?.[0];if(!file)return;const bitmap=await createImageBitmap(file);const detector=new BarcodeDetector({formats:['qr_code']});const found=await detector.detect(bitmap);bitmap.close?.();if(!found.length)throw Error('QRコードを検出できませんでした');document.getElementById('qrCodeIn').value=found[0].rawValue;qrLoad()}catch(e){alert(e.message)}}
function qrLoad(){try{qrGuest=qrDecode(document.getElementById('qrCodeIn').value);modal(`<h2>読み込み完了</h2><p><b>${safe(qrGuest.name)}</b> (${safe(spec({species:qrGuest.species}).name)})</p>${names.map((n,i)=>`<span class="pill">${n} ${qrGuest.stats[i]}</span>`).join(' ')}<p><button onclick="qrStart('auto')">🤖 AI同士で対戦</button> <button onclick="qrStart('manual')">🎮 自分で操作</button></p><p class="small muted">対戦データはコピーです。元の育成データは変更しません。</p>`)}catch(e){alert(e.message)}}
function qrStop(){if(qrDuelTimer){clearInterval(qrDuelTimer);qrDuelTimer=null}}
function qrMoves(m){const unlocked=m.unlockedSkills||[0,2,4];return [0,1,2].map(range=>{const equipped=m.equippedSkills?.[range];if(unlocked.includes(equipped)&&battleSkills[equipped]?.range===range)return equipped;return unlocked.find(i=>battleSkills[i]?.range===range)}).filter(i=>i!==undefined)}
function qrStart(mode){if(!qrGuest||!qrSelf())return;qrStop();const a=qrPack(qrSelf()),b=qrGuest;qrDuel={a,b,mode,ahp:a.a[0]+100,bhp:b.stats[0]+100,amax:a.a[0]+100,bmax:b.stats[0]+100,ag:50,bg:50,time:90,range:1,coolA:0,coolB:0,paused:false,logs:['対戦開始！'],ended:false};qrShow();qrDuelTimer=setInterval(qrTick,1000)}
function qrLog(msg){qrDuel.logs.unshift(msg);qrDuel.logs=qrDuel.logs.slice(0,6)}
function qrAttack(side,idx){const d=qrDuel;if(!d||d.ended)return false;const mine=side==='a',m=mine?{species:d.a.s,stats:d.a.a}:{species:d.b.species,stats:d.b.stats},enemy=mine?d.b.stats:d.a.a;const g=mine?d.ag:d.bg;const sk=battleSkills[idx];if(!sk||g<sk.cost)return false;const tuned=speciesSkillStats(m,sk),effect=skillEffect(sk);const hit=clamp(.72+tuned.accuracy/100+(m.stats[3]-enemy[4])/1600+gutsAccuracyBonus(g),.15,.98);if(mine)d.ag-=sk.cost;else d.bg-=sk.cost;const label=mine?d.a.n:d.b.name;if(Math.random()>hit){qrLog(`${label}の${tuned.name}は外れた`);return true}const raw=Math.max(5,Math.round((tuned.power+m.stats[sk.kind]*.16)*100/(100+enemy[5]*.2)));const targetG=mine?d.bg:d.ag;const dmg=Math.max(1,Math.round(raw*effect.mult*gutsAttackMultiplier(g)*gutsDefenseMultiplier(targetG)));if(mine)d.bhp=Math.max(0,d.bhp-dmg);else d.ahp=Math.max(0,d.ahp-dmg);if(effect.type==='guts'){if(mine)d.bg=Math.max(0,d.bg-effect.amount);else d.ag=Math.max(0,d.ag-effect.amount)}if(effect.type==='drain'){const heal=Math.min(effect.cap,Math.round(dmg*effect.rate));if(mine)d.ahp=Math.min(d.amax,d.ahp+heal);else d.bhp=Math.min(d.bmax,d.bhp+heal)}qrLog(`${label}の${tuned.name}！ ${dmg}ダメージ${effect.type==='guts'?' / ガッツダウン':effect.type==='drain'?' / HP吸収':''}`);return true}
function qrAi(side){const d=qrDuel,m=side==='a'?{unlockedSkills:d.a.u,equippedSkills:d.a.e}:{unlockedSkills:d.b.unlockedSkills,equippedSkills:d.b.equippedSkills},g=side==='a'?d.ag:d.bg;const available=qrMoves(m).filter(i=>battleSkills[i].cost<=g&&(side==='b'||battleSkills[i].range===d.range));if(!available.length)return;available.sort((x,y)=>{const a=battleSkills[x],b=battleSkills[y];return (b.power/(b.cost+12))-(a.power/(a.cost+12))});qrAttack(side,available[Math.floor(Math.random()*Math.min(2,available.length))])}
function qrTick(){const d=qrDuel;if(!d||d.ended||d.paused)return;d.time--;d.ag=Math.min(100,d.ag+5);d.bg=Math.min(100,d.bg+6);d.coolA--;d.coolB--;if(d.mode==='auto'&&d.coolA<=0){qrAi('a');d.coolA=3}if(d.coolB<=0){qrAi('b');d.coolB=3}if(d.time<=0||d.ahp<=0||d.bhp<=0){qrEnd();return}qrShow()}
function qrEnd(){const d=qrDuel;if(!d)return;d.ended=true;qrStop();const win=d.ahp/d.amax>d.bhp/d.bmax?'a':d.ahp/d.amax<d.bhp/d.bmax?'b':'draw';qrLog(win==='draw'?'引き分け！':`${win==='a'?d.a.n:d.b.name}の勝利！`);qrShow()}
function qrMove(delta){if(!qrDuel||qrDuel.ended||qrDuel.paused)return;qrDuel.range=clamp(qrDuel.range+delta,0,2);qrShow()}
function qrManual(i){const d=qrDuel;if(!d||d.ended||d.paused||d.mode!=='manual'||battleSkills[i]?.range!==d.range||d.ag<battleSkills[i].cost)return;d.paused=true;const q=makeQuestion(state.level);d.question=q;d.skill=i;modal(`<h2>⚔️ ${safe(speciesSkillName({species:d.a.s},battleSkills[i]))}</h2><p>数学問題の回答中は時間停止</p><div class="question">${safe(q.text)}</div><input id="qrAnswer" type="text" inputmode="decimal" autocomplete="off" placeholder="答えを数字で入力"><button onclick="qrSubmit()">回答して攻撃</button><button class="secondary" onclick="qrMinus()">− マイナス</button>`)}
function qrMinus(){const el=document.getElementById('qrAnswer');if(el)el.value=el.value.startsWith('-')?el.value.slice(1):'-'+el.value}
function qrSubmit(){const d=qrDuel;if(!d?.paused)return;const el=document.getElementById('qrAnswer'),val=parseMathNumber(el.value);if(!Number.isFinite(val))return;const ok=Math.abs(val-d.question.ans)<1e-8;if(ok)qrAttack('a',d.skill);else{d.ag=Math.max(0,d.ag-Math.ceil(battleSkills[d.skill].cost/2));qrLog('不正解！ ガッツを消費した')}d.paused=false;d.question=null;if(d.ahp<=0||d.bhp<=0)qrEnd();else qrShow()}
function qrQuit(){qrStop();qrDuel=null;closeModal();render()}
function qrShow(){const d=qrDuel;if(!d)return;const am={species:d.a.s},bm={species:d.b.species};const moves=qrMoves({unlockedSkills:d.a.u,equippedSkills:d.a.e});modal(`<h2>⚔️ QRモンスター対戦 ${d.mode==='auto'?'AI観戦':'手動操作'}</h2><p>${safe(d.a.n)} ${spec(am).icon} vs ${spec(bm).icon} ${safe(d.b.name)}</p><p>HP ${d.ahp}/${d.amax}　対　${d.bhp}/${d.bmax}</p><p>ガッツ ${d.ag}　対　${d.bg}　残り ${d.time}秒</p><p>距離：${['近','中','遠'][d.range]}　${d.ended?'試合終了':''}</p>${d.mode==='manual'&&!d.ended?`<button class="secondary" onclick="qrMove(-1)">近づく</button><button class="secondary" onclick="qrMove(1)">離れる</button><div class="actions">${moves.filter(i=>battleSkills[i].range===d.range).map(i=>`<button onclick="qrManual(${i})" ${d.ag<battleSkills[i].cost?'disabled':''}>${safe(speciesSkillName(am,battleSkills[i]))} (ガッツ${battleSkills[i].cost})</button>`).join('')||'<p>この距離にセットできる技がありません</p>'}</div>`:''}<div class="log">${d.logs.map(x=>`<p>${safe(x)}</p>`).join('')}</div><button class="secondary" onclick="qrQuit()">${d.ended?'閉じる':'対戦を終了'}</button>`)}

</script><script>
// Skill equipment and adventure scrolls. Save-compatible extension.
const secretScrolls=[
 {id:'scroll_thunder',name:'雷縛の秘伝書',skill:18,area:1,stat:3,min:220,desc:'中距離・命中重視のガッツダウン技'},
 {id:'scroll_soul',name:'吸魂の秘伝書',skill:19,area:0,stat:2,min:220,desc:'近距離・HPドレイン技'},
 {id:'scroll_star',name:'星詠みの秘伝書',skill:20,area:2,stat:2,min:360,desc:'遠距離・命中重視のかしこさ技'}
];
battleSkills.push(
 {name:'雷縛の一撃',range:1,cost:29,power:35,kind:2,accuracy:8,secret:true},
 {name:'ソウルドレイン',range:0,cost:32,power:39,kind:2,accuracy:0,secret:true},
 {name:'スターフォール',range:2,cost:37,power:58,kind:2,accuracy:12,secret:true}
);
const secretOldEffect=skillEffect;
skillEffect=function(sk){if(sk===battleSkills[18])return {type:'guts',amount:12,mult:.82};if(sk===battleSkills[19])return {type:'drain',rate:.20,cap:18,mult:.76};return secretOldEffect(sk)};
const secretOldName=speciesSkillName;
speciesSkillName=function(m,sk){return sk?.secret?sk.name:secretOldName(m,sk)};
function skillSlots(m){extras(m);if(!Array.isArray(m.equippedSkills))m.equippedSkills=[null,null,null];for(let r=0;r<3;r++){const i=m.equippedSkills[r];if(!m.unlockedSkills.includes(i)||battleSkills[i]?.range!==r)m.equippedSkills[r]=m.unlockedSkills.find(x=>battleSkills[x]?.range===r)??null}return m.equippedSkills}
function setFarmSkill(range){const m=state?.monsters[state.active],el=document.getElementById('farmSlot'+range);if(!m||!el)return;const id=Number(el.value);if(!m.unlockedSkills.includes(id)||battleSkills[id]?.range!==range)return;skillSlots(m)[range]=id;save();showSkills()}
function secretInventory(){if(!state)return {};ensureExtras();return state.inventory}
function scrollPanel(m){const inv=secretInventory();return `<h3>📜 冒険の秘伝書</h3><p class="small muted">冒険成功時に低確率で発見。能力条件を満たすと、秘伝書と600Gを使い1週間の特別修行で習得できます。</p>${secretScrolls.map(x=>`<div class="notice"><b>${x.name}</b>　所持${inv[x.id]||0}冊<br><small>${x.desc} / 必要能力：${names[x.stat]} ${x.min}（現在${m.stats[x.stat]}）</small><p><button onclick="learnSecretSkill('${x.id}')" ${(inv[x.id]||0)<1||m.unlockedSkills.includes(x.skill)||m.stats[x.stat]<x.min||state.money<600?'disabled':''}>${m.unlockedSkills.includes(x.skill)?'習得済み':'特別修行（600G・1週間）'}</button></p></div>`).join('')}`}
function learnSecretSkill(id){const x=secretScrolls.find(z=>z.id===id),m=state?.monsters[state.active],inv=secretInventory();if(!x||!m||!(inv[id]>0)||m.unlockedSkills.includes(x.skill)||m.stats[x.stat]<x.min||state.money<600)return;if(!confirm(`${x.name}を消費し、600G・1週間で${battleSkills[x.skill].name}を習得しますか？`))return;inv[id]--;state.money-=600;m.unlockedSkills.push(x.skill);m.fatigue=clamp(m.fatigue+10,0,100);log(`${m.name}は秘伝書から「${battleSkills[x.skill].name}」を習得！`);advance();save();showSkills();render()}
showSkills=function(){const m=state?.monsters[state.active];if(!m)return;const slots=skillSlots(m);modal(`<h2>📖 技図鑑・技セット</h2><p>距離ごとに技を1つ装備します。ちから技・かしこさ技の制限はありません。装備を外しても使用回数と習得状況は残ります。</p>${['近距離','中距離','遠距離'].map((name,r)=>`<div class="notice"><label for="farmSlot${r}">${name}（1枠）</label><select id="farmSlot${r}" onchange="setFarmSkill(${r})">${m.unlockedSkills.filter(i=>battleSkills[i]?.range===r).map(i=>`<option value="${i}" ${slots[r]===i?'selected':''}>${safe(speciesSkillName(m,battleSkills[i]))} / ${skillType(battleSkills[i])} / G${battleSkills[i].cost}</option>`).join('')}</select></div>`).join('')}<h3>習得済み・未習得技</h3>${battleSkills.map((sk,i)=>`<div class="notice"><b>${safe(speciesSkillName(m,sk))}</b> ${skillBadge(sk)} / ${['近','中','遠'][sk.range]}距離<br><small>威力${speciesSkillStats(m,sk).power} / 命中${speciesSkillStats(m,sk).accuracy} / G${sk.cost} / ${skillEffectLabel(sk)} / ${m.unlockedSkills.includes(i)?'習得済み':'未習得'} / 使用${m.skillUses?.[i]||0}回</small></div>`).join('')}${scrollPanel(m)}<button onclick="closeModal()">閉じる</button>`)};
const secretOldBattleShow=showBattle;
showBattle=function(){secretOldBattleShow();if(!battle||battle.finished)return;const m=state?.monsters[state.active],slots=skillSlots(m),buttons=document.querySelector('.battlebuttons');if(!buttons)return;buttons.innerHTML=slots.map((i,r)=>{if(i===null)return `<button disabled>${['近','中','遠'][r]}距離：未セット</button>`;const sk=battleSkills[i],t=speciesSkillStats(m,sk);return `<button onclick="useSkill(${i})" ${r!==battle.distance||battle.guts<sk.cost?'disabled':''}>${safe(t.name)}<br>${skillBadge(sk)}<br><small>G${sk.cost} / 威力${t.power} / 命中${t.accuracy>=0?'+':''}${t.accuracy} / ${skillEffectLabel(sk)}</small></button>`}).join('')};
const secretOldUse=useSkill;
useSkill=function(i){const m=state?.monsters[state.active];if(!m||!skillSlots(m).includes(i))return;return secretOldUse(i)};
const secretOldFinishExpedition=finishExpedition;
finishExpedition=function(){const index=expeditionPending,m=state?.monsters[state.active],before=state?.logs?.length||0;secretOldFinishExpedition();if(index===null||!state||!m)return;const fresh=state.logs.slice(before).join(' ');if(!fresh.includes('探索成功'))return;const pool=secretScrolls.filter(x=>x.area===index);if(!pool.length||Math.random()>=.25)return;const item=pool[Math.floor(Math.random()*pool.length)];const inv=secretInventory();inv[item.id]=(inv[item.id]||0)+1;log(`📜 冒険で「${item.name}」を発見！ 技図鑑から特別修行できます。`);save();const el=document.querySelector('.modal');if(el)el.insertAdjacentHTML('beforeend',`<div class="notice">📜 追加報酬：${item.name}！</div>`)};
const secretOldRender=render;
render=function(){secretOldRender();if(!state?.monsters[state.active])return;const root=document.querySelector('#app .grid>div:last-child');if(root)root.insertAdjacentHTML('beforeend',`<section class="panel"><h2>⚔️ 技の装備・秘伝書</h2><p class="small muted">近・中・遠距離に各1技をセット。冒険で見つけた秘伝書から特殊技を習得できます。</p><button onclick="showSkills()">技をセット・秘伝書を確認</button></section>`)};
</script><style>
#farmGuideLaunch{background:#255e93;color:white;border:1px solid #86baf0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
#farmGuideOverlay{position:fixed;inset:0;z-index:99999;background:rgba(9,17,33,.79);display:none;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
#farmGuideOverlay.open{display:flex}
#farmGuideCard{background:#fff;color:#172338;width:min(100%,550px);max-height:90dvh;overflow-y:auto;border-radius:18px;padding:23px;box-sizing:border-box;box-shadow:0 18px 60px #0007}
#farmGuideCard h2{margin:8px 0 12px;color:#17375e}#farmGuideCard p{line-height:1.8}#farmGuideCard .guideTag{color:#32699b;font-size:13px;font-weight:800}
#farmGuideCard .guideInfo{background:#edf5ff;border-left:4px solid #3985c4;border-radius:8px;padding:11px 13px;line-height:1.7;margin:12px 0}
#farmGuideCard .guideNav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}#farmGuideCard .guideNav button{flex:1;min-width:90px;padding:12px;border-radius:9px;cursor:pointer}
#farmGuideCard .guideDots{display:flex;gap:5px;margin:12px 0}#farmGuideCard .guideDots i{height:5px;flex:1;background:#d7e1ed;border-radius:10px}#farmGuideCard .guideDots i.on{background:#2375b9}
</style><script>
/* First-play guide: independent from game save data and battle state. */
(function(){
'use strict';
const KEY='math_monster_farm_tutorial_v1';
const steps=[
{title:'数式モンスターファームへようこそ！',body:'このゲームでは、数学問題を解きながらモンスターを育て、大会の頂点を目指します。育成には寿命があり、仕事・休養・大会のバランスが大切です。',tip:'最初は「仕事 → 休養 → 大会」の流れを覚えれば大丈夫です。'},
{title:'① モンスターを育てよう',body:'「今週の育成」から仕事を選ぶと数学問題が出ます。正解すると成長ボーナスが得られます。仕事をすると1週間が経過し、能力と疲労が変化します。',tip:'ちから・かしこさ・命中・回避・丈夫さなど、モンスターの得意能力を中心に伸ばしましょう。'},
{title:'② 疲労とストレスに注意',body:'仕事を続けると疲労やストレスが増えます。「休養」や「おやつ」を使って調整しましょう。モンスターには寿命があり、無理をさせると寿命が余計に減ります。',tip:'疲労・ストレスが65を超える前に休ませるのが基本です。'},
{title:'③ 数学問題の答え方',body:'問題の答えを数字で入力します。負の数のときは「−」ボタンを利用できます。数学問題に回答している間、バトルの試合時間は止まります。',tip:'難易度は変更できます。難しすぎる場合は「数学レベル変更」を使ってください。'},
{title:'④ 大会とガッツ',body:'大会では数学問題に正解して技を出します。ガッツは技の使用に必要で、残量が多いほど攻撃・防御・命中が少し有利になります。技には距離と消費ガッツがあります。',tip:'最初はガッツをため、使える距離の技を選ぶことを意識しましょう。'},
{title:'⑤ 技をセットしよう',body:'「技をセット・秘伝書を確認」から、近距離・中距離・遠距離にそれぞれ1つずつ技をセットできます。ちから技・かしこさ技のどちらでも選べます。',tip:'新しい技を覚えたら、技セットを確認しましょう。セットから外しても習得情報は消えません。'},
{title:'⑥ 季節の冒険と秘伝書',body:'冒険は決まった月に開催されます。推奨能力と現在能力、報酬、疲労などの注意点を確認して参加しましょう。冒険で見つけた秘伝書は、条件を満たすと特別な技の習得に使えます。',tip:'冒険に出る前に、推奨能力と疲労・ストレスを必ず確認しましょう。'},
{title:'⑦ 大会を勝ち進もう',body:'通常大会でランクを上げ、Sランク大会で優勝すると四大大会が順番に解放されます。四大大会も通常の大会出場画面から参加します。',tip:'「次の目標」には育成状況に応じた目標が表示されます。'},
{title:'⑧ 合体・QR対戦でさらに楽しもう',body:'育てたモンスターは合体に利用でき、親の能力が子の初期能力に一部引き継がれます。QR対戦では別端末のモンスターを読み込み、AI対戦や自分で操作する対戦を楽しめます。',tip:'合体後の成長適性は親のメイン種族の基本適性を80:20で参照し、世代ごとに累積しません。'},
{title:'準備完了！',body:'まずは仕事で能力を伸ばし、疲れたら休養。技をセットして大会に挑戦しましょう。分からなくなったら、画面上部の「📖 あそびかた」からいつでも読み直せます。',tip:'ゲームのセーブデータとは別にチュートリアルの閲覧状況だけを保存します。'}
];
let index=0;
function guide(){return document.getElementById('farmGuideOverlay')}
function draw(){const el=document.getElementById('farmGuideCard');if(!el)return;const s=steps[index];el.innerHTML='<div class="guideTag">はじめての人向けガイド　'+(index+1)+' / '+steps.length+'</div><div class="guideDots">'+steps.map((_,i)=>'<i class="'+(i<=index?'on':'')+'"></i>').join('')+'</div><h2>'+s.title+'</h2><p>'+s.body+'</p><div class="guideInfo">💡 '+s.tip+'</div><div class="guideNav"><button type="button" class="secondary" id="farmGuideSkip">閉じる</button>'+(index?'<button type="button" class="secondary" id="farmGuideBack">戻る</button>':'')+'<button type="button" id="farmGuideNext">'+(index===steps.length-1?'完了して遊ぶ':'次へ →')+'</button></div>';
document.getElementById('farmGuideSkip').onclick=close;const back=document.getElementById('farmGuideBack');if(back)back.onclick=()=>{index--;draw()};document.getElementById('farmGuideNext').onclick=()=>{if(index<steps.length-1){index++;draw()}else close()};}
function open(){index=0;guide().classList.add('open');guide().setAttribute('aria-hidden','false');draw();}
function close(){guide().classList.remove('open');guide().setAttribute('aria-hidden','true');try{localStorage.setItem(KEY,'1')}catch(e){}}
window.openFarmTutorial=open;
const overlay=document.createElement('div');overlay.id='farmGuideOverlay';overlay.setAttribute('aria-hidden','true');overlay.innerHTML='<div id="farmGuideCard" role="dialog" aria-modal="true" aria-label="あそびかた"></div>';document.body.appendChild(overlay);
const btn=document.createElement('button');btn.type='button';btn.id='farmGuideLaunch';btn.textContent='📖 あそびかた';btn.onclick=open;
(document.querySelector('header .topbuttons')||document.querySelector('header')||document.body).prepend(btn);
// New games only: show after the first monster is created; never interrupt returning players.
if(typeof window.start==='function'){
const original=window.start;
window.start=function(...args){const wasNew=!window.state;const result=original.apply(this,args);if(wasNew&&window.state){let seen=false;try{seen=localStorage.getItem(KEY)==='1'}catch(e){}if(!seen)open()}return result};
}
})();
</script></body></html>
