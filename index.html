<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数式モンスターファーム Phase 3 技タイプ表示版</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f4f4e8;background:#101e2a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#102739,#213b32);min-height:100vh}header{background:#10202adf;padding:15px max(14px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #b4a064}h1{font-size:clamp(19px,3vw,28px);margin:0;color:#ffe7a2}h2{font-size:20px;margin:0 0 14px;color:#ffe7a2}h3{margin:6px 0}.wrap{max-width:1080px;margin:auto;padding:18px 14px 60px}.panel{background:#172c36ee;border:1px solid #48636b;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px #07121b40}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#b6c9c8}.small{font-size:13px}.pill{background:#365a59;border-radius:30px;padding:5px 11px;display:inline-block;font-size:13px}button,input,select{font:inherit}button{background:#e5bb64;color:#202a2a;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:750;transition:.15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#3a5965;color:white}.danger{background:#b85755;color:white}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{text-align:left;min-height:77px}.action span{display:block;font-weight:400;font-size:12px;opacity:.83;margin-top:4px}input,select{background:#f7f5e9;color:#1b2930;border:2px solid #b8bfae;border-radius:9px;padding:12px;width:100%;margin:6px 0 12px}label{display:block;font-weight:700}.stat{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:14px}.track{height:11px;border-radius:10px;background:#30444b;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5bb8b0,#d6dc84)}.monster{font-size:110px;text-align:center;filter:drop-shadow(0 12px 5px #09151a88);line-height:1.35;animation:bob 2.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.ranch{background:radial-gradient(ellipse at 50% 110%,#55794a 0%,#345849 48%,#213b4a 90%);border-radius:15px;padding:20px 10px 12px;min-height:185px;text-align:center}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid #4b6870;border-radius:12px;padding:12px;cursor:pointer;text-align:center;background:#233c46}.choice.active{border-color:#ffe7a2;background:#405c53}.choice .emoji{font-size:43px}.log{max-height:175px;overflow:auto;font-size:13px;color:#d5e2df}.log p{border-bottom:1px solid #344d56;padding-bottom:8px}.overlay{position:fixed;inset:0;background:#06131ce9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{width:min(100%,560px);max-height:94vh;overflow:auto;background:#203943;border:2px solid #d7b971;border-radius:20px;padding:25px;box-shadow:0 20px 90px #000a}.question{font-size:clamp(25px,5vw,40px);text-align:center;margin:22px 0;font-weight:800;color:#fff0bc}.notice{padding:12px;background:#334b50;border-radius:10px;margin:12px 0;white-space:pre-wrap}.hidden{display:none!important}.topbuttons{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;color:#9cb7b7;font-size:12px;padding:15px}@media(max-width:740px){.grid{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}.monster{font-size:90px}header{align-items:flex-start;flex-direction:column}.panel{padding:14px}}
</style><style>
.battlebar{height:12px;background:#30444b;border-radius:12px;overflow:hidden;margin:6px 0}.battlebar>div{height:100%;background:#64c69b}.battlebar.enemy>div{background:#e37d6b}.arena{background:linear-gradient(#294653,#274c3d);border-radius:14px;padding:16px;text-align:center}.fighters{display:flex;justify-content:space-around;font-size:76px}.battlebuttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.battlebuttons button{font-size:14px}.battlefeed{max-height:110px;overflow:auto;font-size:13px;background:#142b35;padding:10px;border-radius:8px}.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rankline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;padding:10px;background:#25424b;border-radius:9px}.modal.wide{width:min(100%,740px)}
.skill-type{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:800;margin:4px 0}.skill-power{background:#8e4038;color:#fff0e9}.skill-wisdom{background:#255e93;color:#e9f7ff}.battlebuttons button{line-height:1.4}</style></head><body><header><h1>✦ 数式モンスターファーム <span class="small">Phase 3</span></h1><div class="topbuttons"><button class="secondary" onclick="save(true)">保存</button><button class="secondary" onclick="exportSave()">バックアップ</button><button class="secondary" onclick="document.getElementById('importFile').click()">読込</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importSave(event)"></div></header><main class="wrap"><div id="app"></div></main><footer>ブラウザに自動保存されます。バックアップファイルも定期的に保存してください。</footer><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>
'use strict';const KEY='mathMonsterFarm.phase1.v1';const species=[{id:'flare',name:'フレアドラゴン',icon:'🐲',type:'ちから型',growth:[1.1,1.35,.65,.9,.85,1],life:180},{id:'aqua',name:'アクアドラゴン',icon:'🐉',type:'かしこさ型',growth:[1, .75,1.4,1.1,.95,.8],life:192},{id:'rock',name:'ロックゴーレム',icon:'🗿',type:'丈夫さ型',growth:[1.2,1.15,.65,.7,.55,1.5],life:205},{id:'leaf',name:'リーフィー',icon:'🌱',type:'長寿型',growth:[1.2,.7,1.2,.95,1.1,.9],life:230},{id:'ghost',name:'ファントム',icon:'👻',type:'回避型',growth:[.7,.75,1.25,1.2,1.5,.55],life:185},{id:'bolt',name:'ボルトフォックス',icon:'🦊',type:'命中型',growth:[.9,1.05,1,1.5,1.3,.65],life:180}];const names=['ライフ','ちから','かしこさ','命中','回避','丈夫さ'];const jobs=[{name:'走り込み',stat:0,stress:4,fatigue:10,desc:'ライフを伸ばす軽仕事'},{name:'重り運び',stat:1,stress:5,fatigue:12,desc:'ちからを伸ばす軽仕事'},{name:'数学研究',stat:2,stress:4,fatigue:10,desc:'かしこさを伸ばす軽仕事'},{name:'的当て',stat:3,stress:5,fatigue:11,desc:'命中を伸ばす軽仕事'},{name:'障害物回避',stat:4,stress:5,fatigue:11,desc:'回避を伸ばす軽仕事'},{name:'岩運び',stat:5,stress:6,fatigue:12,desc:'丈夫さを伸ばす軽仕事'},{name:'高速計算',stat:3,other:2,heavy:true,stress:13,fatigue:23,desc:'命中・かしこさを大きく伸ばす'},{name:'数式特訓',stat:2,other:1,heavy:true,stress:14,fatigue:25,desc:'かしこさ・ちからを大きく伸ばす'},{name:'高速障害物訓練',stat:4,other:3,heavy:true,stress:14,fatigue:25,desc:'回避を大きく・命中も伸ばす重仕事'},{name:'鉄壁防御訓練',stat:5,other:0,heavy:true,stress:15,fatigue:26,desc:'丈夫さを大きく・ライフも伸ばす重仕事'}];let state=null;let pending=null;let selected=0;let question=null;let locked=false;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(x,a,b){return Math.min(b,Math.max(a,x))}function spec(m){return species.find(s=>s.id===m.species)||species[0]}function yearWeek(w){return `${Math.floor(w/48)+1}年 ${Math.floor((w%48)/4)+1}月 第${w%4+1}週`}function stage(m){let r=m.age/m.lifespan;return r<.15?'幼年期':r<.35?'成長期':r<.65?'最盛期':r<.82?'成熟期':'晩年期'}function condition(m){const burden=Math.max(m.fatigue,m.stress)*.65+(m.fatigue+m.stress)*.175;return burden>=85?'危険':burden>=65?'要休養':burden>=40?'やや疲れ':'元気'}function growth(m){let r=m.age/m.lifespan;return r<.15?.55:r<.35?1:r<.65?1.5:r<.82?.9:.5}function log(t){state.logs.unshift(`${yearWeek(state.week)}：${t}`);state.logs=state.logs.slice(0,35)}function save(show=false){if(state){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)alert('保存しました。')}catch(e){alert('保存に失敗しました。バックアップを利用してください。')}}}function init(){try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&v.version===1&&Array.isArray(v.monsters)&&Number.isFinite(v.week)){state=v}}}catch(e){}render()}
function makeMonster(id,name){const s=species.find(x=>x.id===id);return {id:Date.now()+Math.random(),species:id,name:name.trim().slice(0,16)||s.name,stats:s.growth.map(x=>Math.round(65+40*x+rand(0,25))),age:0,lifespan:s.life+rand(-12,12),fatigue:0,stress:0,loyalty:55,history:[],retired:false}}function start(){let name=document.getElementById('monsterName').value;state={version:1,week:0,money:5000,monsters:[makeMonster(species[selected].id,name)],active:0,logs:[],records:[],answers:{correct:0,total:0},level:document.getElementById('level').value};log('ファームが始まりました。新しいモンスターが誕生！');save();render()}
function render(){const app=document.getElementById('app');if(!state){app.innerHTML=`<section class="panel"><h2>モンスターを誕生させよう</h2><p class="muted">毎週1回の仕事で数学問題に挑戦。能力を伸ばしながら寿命のあるモンスターを育てよう。</p><div class="six">${species.map((s,i)=>`<div class="choice ${selected===i?'active':''}" onclick="selectSpecies(${i})"><div class="emoji">${s.icon}</div><b>${s.name}</b><div class="small muted">${s.type}</div></div>`).join('')}</div><p><label for="monsterName">モンスターの名前</label><input id="monsterName" maxlength="16" placeholder="名前を入力（省略可）"></p><label for="level">数学の難易度</label><select id="level"><option value="elementary">小学生</option><option value="junior" selected>中学生</option><option value="high">高校生</option></select><button onclick="start()" style="width:100%">育成をはじめる</button></section>`;return}const m=state.monsters[state.active];if(!m){app.innerHTML=`<div class="panel"><h2>育成するモンスターがいません</h2><p>次のモンスターを迎えて、新しい世代の育成を始めましょう。</p><button onclick="newMonster()">新しいモンスターを迎える</button></div><div class="panel"><h2>育成記録</h2>${state.records.map(r=>`<p>${safe(r.name)} / ${safe(r.species)} / ${r.age}週 / 合計能力 ${r.total}</p>`).join('')||'まだ記録がありません'}</div>`;return}const s=spec(m);app.innerHTML=`<div class="grid"><div><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="pill">📅 ${yearWeek(state.week)}</span><span class="pill">💰 ${state.money.toLocaleString()} G</span></div><div class="ranch"><div class="monster">${s.icon}</div><h2 style="margin:0">${safe(m.name)}</h2><span class="small">${s.name} / ${stage(m)}</span></div><p class="small muted">年齢：${Math.floor(m.age/48)}歳 ${Math.floor(m.age%48/4)}か月 / 忠誠度 ${m.loyalty}</p>${names.map((n,i)=>`<div class="stat"><span>${n}</span><div class="track"><div class="fill" style="width:${m.stats[i]/999*100}%"></div></div><b>${m.stats[i]}</b></div>`).join('')}<div class="small muted">体調：<b>${condition(m)}</b>　疲労 ${m.fatigue}/100　ストレス ${m.stress}/100</div><div class="small muted">数学の正答率 ${state.answers.total?Math.round(state.answers.correct/state.answers.total*100):0}%（${state.answers.correct}/${state.answers.total}）</div></section><section class="panel"><h2>ファームの記録</h2><div class="log">${state.logs.map(x=>`<p>${safe(x)}</p>`).join('')}</div></section></div><div><section class="panel"><h2>今週の育成</h2><p class="muted small">仕事を選ぶと数学問題が1問出題されます。正解で成長ボーナス！</p><div class="actions">${jobs.map((j,i)=>`<button class="secondary action" onclick="beginJob(${i})">${j.heavy?'🔥':'🌿'} ${j.name}<span>${j.desc} / 疲労+${j.fatigue}</span></button>`).join('')}</div></section><section class="panel"><h2>休養・生活</h2><div class="actions"><button onclick="rest()">💤 休養<span class="small" style="display:block">疲労-40、ストレス-20</span></button><button onclick="feed()">🍎 おやつ 300G<span class="small" style="display:block">ストレス-18、忠誠度+3 / 1週</span></button><button class="secondary" onclick="changeLevel()">📚 数学レベル変更</button><button class="secondary" onclick="showRecords()">🏅 育成記録</button></div><p class="small muted">行動1回で1週間経過。体調は疲労・ストレスから判定。各値が65を超えると寿命が追加減少し、86以上では減少が増えます。</p></section><section class="panel"><h2>次の目標</h2><p>まずは能力合計 <b>1,000</b> を目指そう！</p><p class="muted small">大会で勝利してランクを上げよう！ 数学問題中は試合時間が止まります。</p><button class="danger" onclick="retireAsk()">モンスターを引退させる</button></section></div></div>`}
function selectSpecies(i){selected=i;const v=document.getElementById('monsterName')?.value||'';const lev=document.getElementById('level')?.value||'junior';render();document.getElementById('monsterName').value=v;document.getElementById('level').value=lev}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function makeQuestion(level){let a,b,c,x,txt,ans;if(level==='elementary'){let k=rand(0,3);if(k===0){a=rand(12,90);b=rand(11,65);txt=`${a} + ${b} = ?`;ans=a+b}else if(k===1){a=rand(30,99);b=rand(5,a);txt=`${a} − ${b} = ?`;ans=a-b}else if(k===2){a=rand(3,12);b=rand(3,12);txt=`${a} × ${b} = ?`;ans=a*b}else{b=rand(2,12);ans=rand(2,12);txt=`${b*ans} ÷ ${b} = ?`}}else if(level==='junior'){let k=rand(0,3);if(k===0){x=rand(-12,12);a=rand(2,8);b=rand(-15,15);txt=`${a}x ${b<0?'−':'+'} ${Math.abs(b)} = ${a*x+b}　の x = ?`;ans=x}else if(k===1){a=rand(-15,15);b=rand(-15,15);txt=`(${a}) × (${b}) = ?`;ans=a*b}else if(k===2){x=rand(-8,8);a=rand(2,7);b=rand(-10,10);txt=`${a}(x ${b<0?'−':'+'} ${Math.abs(b)}) = ${a*(x+b)}　の x = ?`;ans=x}else{a=rand(2,12);b=rand(2,12);txt=`${a*a} − ${b*b} = ?`;ans=a*a-b*b}}else{let k=rand(0,3);if(k===0){a=rand(-8,8);b=rand(-8,8);txt=`f(x) = x² ${a<0?'−':'+'} ${Math.abs(a)}x ${b<0?'−':'+'} ${Math.abs(b)}　の f(2) = ?`;ans=4+2*a+b}else if(k===1){a=rand(1,7);b=rand(-8,8);txt=`y = ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}　の最小値は？`;ans=b}else if(k===2){a=rand(2,9);b=rand(2,9);txt=`数列 ${a}, ${a+b}, ${a+2*b}, ... の第10項は？`;ans=a+9*b}else{a=rand(2,8);b=rand(2,8);txt=`(x + ${a})(x + ${b}) の x の係数は？`;ans=a+b}}return {txt,ans}}
function beginJob(i){if(!state?.monsters[state.active])return;pending={job:i};question=makeQuestion(state.level);locked=false;modal(`<h2>📘 ${jobs[i].name} — 数学チャレンジ</h2><p class="muted">正解すると成長ボーナス。不正解でも仕事に挑戦できます。</p><div class="question">${safe(question.txt)}</div><form id="answerForm"><label for="answer">答えを数値で入力</label><input id="answer" type="text" required autocomplete="off" inputmode="text" pattern="[+\-−－]?[0-9０-９]+([.．][0-9０-９]+)?" placeholder="数値を入力"><button type="button" onclick="insertMinus('answer')">− マイナスを入力</button><button type="submit" style="width:100%">解答する</button></form><p class="small muted">問題中に時間制限はありません。</p>`);document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer()};document.getElementById('answer').focus()}
function insertMinus(id){const el=document.getElementById(id);if(!el)return;el.value=el.value.startsWith("-")?el.value.slice(1):"-"+el.value.replace(/^[+−－]/,"");el.focus()}
function parseMathNumber(s){return Number(String(s).trim().replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/[−－]/g,"-").replace(/．/g,"."))}
function submitAnswer(){if(locked||!question||!pending)return;const v=parseMathNumber(document.getElementById('answer').value);if(!document.getElementById('answer').value.trim()||!Number.isFinite(v))return;locked=true;const correct=Math.abs(v-question.ans)<1e-8;state.answers.total++;if(correct)state.answers.correct++;const j=jobs[pending.job],m=state.monsters[state.active],s=spec(m),fail=Math.random()<clamp((m.fatigue-55)/180+(m.stress-65)/250+(65-m.loyalty)/500,.02,.55);let report;if(fail){report=`${m.name}は仕事に失敗した。能力は上がらなかった。`;m.loyalty=clamp(m.loyalty-2,0,100)}else{let amount=Math.max(1,Math.round((j.heavy?13:8)*s.growth[j.stat]*growth(m)*(correct?1.3:1)*(.9+Math.random()*.25)));m.stats[j.stat]=clamp(m.stats[j.stat]+amount,0,999);report=`${names[j.stat]}が +${amount} 上昇！`;if(j.other!==undefined){const extra=Math.max(1,Math.round(amount*.48*s.growth[j.other]));m.stats[j.other]=clamp(m.stats[j.other]+extra,0,999);report+=` ${names[j.other]}も +${extra}！`}m.loyalty=clamp(m.loyalty+1,0,100)}m.fatigue=clamp(m.fatigue+j.fatigue,0,100);m.stress=clamp(m.stress+j.stress,0,100);log(`${j.name}：${correct?'正解':'不正解'}。${report}`);const message=`${correct?'🎉 正解！':'📖 不正解'}　正解は ${question.ans} です。\n${report}`;pending=null;question=null;advance();save();modal(`<h2>${correct?'数学チャレンジ成功！':'数学チャレンジ終了'}</h2><div class="notice">${safe(message)}</div><button onclick="closeModal();render()" style="width:100%">ファームに戻る</button>`)}
function advance(){const m=state.monsters[state.active];state.week++;m.age++;if(m.fatigue>65)m.lifespan-=m.fatigue>85?2:1;if(m.stress>65)m.lifespan-=m.stress>85?2:1;if(m.age>=m.lifespan){archive('寿命を迎えた');return}if(m.age/m.lifespan>.91&&m.age%4===0)log(`${m.name}はかなり年を重ねています。引退を考えてもよさそうです。`)}function rest(){const m=state.monsters[state.active];m.fatigue=clamp(m.fatigue-40,0,100);m.stress=clamp(m.stress-20,0,100);m.loyalty=clamp(m.loyalty+1,0,100);log('ゆっくり休んで疲労を回復した。');advance();save();render()}function feed(){if(state.money<300){alert('所持金が足りません。');return}state.money-=300;const m=state.monsters[state.active];m.stress=clamp(m.stress-18,0,100);m.loyalty=clamp(m.loyalty+3,0,100);log('おやつをあげた。モンスターは喜んでいる！');advance();save();render()}function archive(reason){const m=state.monsters[state.active];state.records.push({name:m.name,species:spec(m).name,age:m.age,total:m.stats.reduce((a,b)=>a+b,0),reason});log(`${m.name}は${reason}。育成記録に登録されました。`);state.monsters.splice(state.active,1);state.active=0;save()}
function retireAsk(){modal('<h2>引退しますか？</h2><p>引退すると、このモンスターは育成記録に残り、ファームから離れます。元には戻せません。</p><div class="topbuttons"><button class="danger" onclick="archive(\'引退した\');closeModal();render()">引退する</button><button class="secondary" onclick="closeModal()">やめる</button></div>')}function newMonster(){selected=0;modal(`<h2>新しいモンスターを迎える</h2><div class="six">${species.map((s,i)=>`<div class="choice ${selected===i?'active':''}" id="new${i}" onclick="selectNew(${i})"><div class="emoji">${s.icon}</div><b>${s.name}</b></div>`).join('')}</div><label for="newName">名前</label><input id="newName" maxlength="16" placeholder="省略可"><button onclick="adopt()" style="width:100%">迎える</button>`)}function selectNew(i){selected=i;species.forEach((_,j)=>document.getElementById('new'+j).classList.toggle('active',j===i))}function adopt(){const n=document.getElementById('newName').value;state.monsters.push(makeMonster(species[selected].id,n));state.active=state.monsters.length-1;log('新しいモンスターを迎えました。');save();closeModal();render()}function changeLevel(){modal(`<h2>数学レベルの変更</h2><select id="newLevel"><option value="elementary">小学生</option><option value="junior">中学生</option><option value="high">高校生</option></select><button onclick="state.level=document.getElementById('newLevel').value;save();closeModal();render()">変更する</button>`);document.getElementById('newLevel').value=state.level}function showRecords(){modal(`<h2>🏅 育成記録</h2>${state.records.length?state.records.map(r=>`<div class="notice"><b>${safe(r.name)}</b> / ${safe(r.species)}<br>${Math.floor(r.age/48)}歳${Math.floor(r.age%48/4)}か月 / 能力合計 ${r.total}<br>${safe(r.reason)}</div>`).join(''):'まだ引退したモンスターはいません。'}<button onclick="closeModal()">閉じる</button>`)}function exportSave(){if(!state){alert('ゲーム開始後に利用できます。');return}save();const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='math_monster_farm_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importSave(e){const f=e.target.files?.[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.version!==1||!Array.isArray(v.monsters)||!Array.isArray(v.records)||!Array.isArray(v.logs)||!Number.isFinite(v.week)||!v.answers||!['elementary','junior','high'].includes(v.level)||v.monsters.some(m=>!species.some(s=>s.id===m.species)||!Array.isArray(m.stats)||m.stats.length!==6||m.stats.some(n=>!Number.isFinite(n))||!Number.isFinite(m.age)||!Number.isFinite(m.lifespan)))throw Error('形式が違います');if(!confirm('現在のデータを読み込んだデータで置き換えますか？'))return;state=v;save();closeModal();render()}catch(err){alert('セーブファイルを読み込めませんでした。')}finally{e.target.value=''}}
// Phase 2: the Phase 1 save key and data schema remain unchanged.
const ranks=['E','D','C','B','A','S'];
const prizes=[1200,2500,5000,9000,16000,30000];
const battleSkills=[
 {name:'体当たり',range:0,cost:12,power:27,kind:1,accuracy:15,question:0},
 {name:'集中打撃',range:0,cost:24,power:48,kind:1,accuracy:0,question:1},
 {name:'数式弾',range:1,cost:18,power:36,kind:2,accuracy:10,question:0},
 {name:'方程式砲',range:1,cost:32,power:65,kind:2,accuracy:-5,question:1},
 {name:'遠隔波動',range:2,cost:22,power:43,kind:2,accuracy:4,question:0},
 {name:'究極数式砲',range:2,cost:46,power:95,kind:2,accuracy:-15,question:1}
];
let battle=null,battleTimer=null;
function ensureBattleData(){if(!state)return;state.battleData??={rank:0,wins:0,losses:0,champions:[],lastTournamentWeek:-1};}
function availableTournament(){ensureBattleData();return state && state.week%4===3 && state.battleData.lastTournamentWeek!==state.week}
function battlePanel(){if(!state||!state.monsters[state.active])return '';ensureBattleData();const d=state.battleData;return `<section class="panel"><h2>🏆 大会・数学バトル</h2><p>現在の公式ランク：<b>${ranks[d.rank]}</b>　通算 ${d.wins}勝 ${d.losses}敗</p><p class="small muted">公式大会は毎月第4週に開催。試合は90秒、問題中は時間停止。勝利すると賞金と昇格資格を獲得します。</p><div class="rankline"><span>次の公式大会：${ranks[d.rank]}ランク / 賞金 ${prizes[d.rank].toLocaleString()}G</span><button onclick="startBattle(true)" ${availableTournament()?'':'disabled'}>大会出場</button></div><div class="rankline"><span>練習試合：報酬なし・週経過なし</span><button class="secondary" onclick="startBattle(false)">練習バトル</button></div><p class="small muted">${availableTournament()?'今週は大会に参加できます。':'大会開催週は毎月第4週です。育成を進めてください。'} 練習試合は育成状態を消費しません。</p></section>`}
const originalRender=render;
render=function(){originalRender();if(state?.monsters[state.active]){const target=document.querySelector('#app .grid>div:last-child');if(target)target.insertAdjacentHTML('beforeend',battlePanel())}};
function stopBattleClock(){if(battleTimer){clearInterval(battleTimer);battleTimer=null}}
function startBattle(official){if(!state?.monsters[state.active]||battle)return;ensureBattleData();if(official&&!availableTournament())return;const m=state.monsters[state.active],d=state.battleData,rank=official?d.rank:Math.max(0,d.rank-1);const enemySpec=species[rand(0,species.length-1)];const strength=115+rank*125+rand(-15,30);const eStats=enemySpec.growth.map(x=>clamp(Math.round(strength*x+rand(-25,25)),50,950));battle={official,rank,enemy:{name:enemySpec.name,species:enemySpec.id,stats:eStats},hp:m.stats[0]+100,ehp:eStats[0]+100,maxhp:m.stats[0]+100,maxehp:eStats[0]+100,guts:50,eguts:45,time:90,distance:1,paused:false,logs:['試合開始！ 距離を調整して技を選ぼう。'],pendingSkill:null,finished:false};if(official){d.lastTournamentWeek=state.week;save()}document.getElementById('modal').classList.add('wide');showBattle();battleTimer=setInterval(battleTick,1000)}
function battleTick(){if(!battle||battle.finished||battle.paused)return;battle.time=Math.max(0,battle.time-1);battle.guts=Math.min(100,battle.guts+5);battle.eguts=Math.min(100,battle.eguts+6);if(battle.time%5===0)enemyTurn();if(battle.hp<=0||battle.ehp<=0||battle.time<=0){finishBattle();return}showBattle()}
function battleLog(s){battle.logs.unshift(s);battle.logs=battle.logs.slice(0,7)}
function enemyTurn(){if(!battle||battle.eguts<16)return;const m=state.monsters[state.active],e=battle.enemy;const cost=16+5*battle.rank;if(battle.eguts<cost)return;battle.eguts-=cost;const chance=clamp(.65+(e.stats[3]-m.stats[4])/1600,.15,.95);if(Math.random()>chance){battleLog(`${e.name}の攻撃は外れた！`);return}const dmg=Math.max(5,Math.round((22+battle.rank*12+e.stats[1]*.08)*100/(100+m.stats[5]*.18)));battle.hp=Math.max(0,battle.hp-dmg);battleLog(`${e.name}の攻撃！ ${dmg}ダメージ。`)}
function moveBattle(delta){if(!battle||battle.paused||battle.finished)return;battle.distance=clamp(battle.distance+delta,0,2);battle.guts=Math.min(100,battle.guts+3);showBattle()}
function useSkill(i){if(!battle||battle.paused||battle.finished)return;const sk=battleSkills[i];if(sk.range!==battle.distance||battle.guts<sk.cost)return;battle.paused=true;battle.pendingSkill=i;question=makeQuestion(state.level);showBattleQuestion(sk)}
function skillType(sk){return sk.kind===1?'ちから技':'かしこさ技'}
function skillBadge(sk){return `<span class="skill-type ${sk.kind===1?'skill-power':'skill-wisdom'}">${skillType(sk)}</span>`}
function showBattleQuestion(sk){modal(`<h2>⚔️ ${safe(sk.name)} ${skillBadge(sk)} — 数学問題</h2><p class="muted">試合時間停止中。正解すると技が発動します。</p><div class="question">${safe(question.txt)}</div><form id="battleAnswerForm"><label for="battleAnswer">答えを数値で入力</label><input id="battleAnswer" type="text" required inputmode="text" autocomplete="off" pattern="[+\-−－]?[0-9０-９]+([.．][0-9０-９]+)?"><button type="button" onclick="insertMinus('battleAnswer')">− マイナスを入力</button><button type="submit" style="width:100%">攻撃する</button></form>`);document.getElementById('battleAnswerForm').onsubmit=e=>{e.preventDefault();answerBattle()};document.getElementById('battleAnswer').focus()}
function answerBattle(){if(!battle||battle.pendingSkill===null||!question)return;const field=document.getElementById('battleAnswer');if(!field.value.trim())return;const val=parseMathNumber(field.value);if(!Number.isFinite(val))return;const correct=Math.abs(val-question.ans)<1e-8,sk=battleSkills[battle.pendingSkill],m=state.monsters[state.active],e=battle.enemy;state.answers.total++;if(correct)state.answers.correct++;battle.guts=Math.max(0,battle.guts-(correct?sk.cost:Math.ceil(sk.cost/2)));if(correct){const hit=clamp(.72+sk.accuracy/100+(m.stats[3]-e.stats[4])/1600,.15,.98);if(Math.random()<hit){const attack=m.stats[sk.kind];const dmg=Math.max(5,Math.round((sk.power+attack*.16)*100/(100+e.stats[5]*.2)));battle.ehp=Math.max(0,battle.ehp-dmg);battleLog(`${sk.name}命中！ ${dmg}ダメージ！`)}else battleLog(`${sk.name}は外れた！`)}else battleLog(`不正解（正解：${question.ans}）。技は失敗した。`);question=null;battle.pendingSkill=null;battle.paused=false;save();if(battle.ehp<=0){finishBattle();return}showBattle()}
function showBattle(){if(!battle||battle.finished)return;const m=state.monsters[state.active],b=battle,e=b.enemy,sp=spec(m),es=spec({species:e.species});modal(`<h2>${b.official?'🏆 公式大会':'⚔️ 練習試合'} — ${ranks[b.rank]}ランク</h2><div class="battle-top"><div><b>${safe(m.name)}</b><div class="battlebar"><div style="width:${100*b.hp/b.maxhp}%"></div></div><small>HP ${b.hp}/${b.maxhp}</small></div><div><b>${safe(e.name)}</b><div class="battlebar enemy"><div style="width:${100*b.ehp/b.maxehp}%"></div></div><small>HP ${b.ehp}/${b.maxehp}</small></div></div><div class="arena"><div class="fighters"><span>${sp.icon}</span><span>${es.icon}</span></div><div>距離：${['近距離','中距離','遠距離'][b.distance]}　⏱ 残り ${b.time}秒</div></div><p>ガッツ：${b.guts}/100</p><div class="battlebar"><div style="width:${b.guts}%;background:#e4bd65"></div></div><div class="topbuttons"><button class="secondary" onclick="moveBattle(-1)" ${b.distance===0?'disabled':''}>近づく ◀</button><button class="secondary" onclick="moveBattle(1)" ${b.distance===2?'disabled':''}>▶ 離れる</button><button class="danger" onclick="forfeitBattle()">棄権</button></div><div class="battlebuttons">${battleSkills.map((sk,i)=>`<button onclick="useSkill(${i})" ${sk.range!==b.distance||b.guts<sk.cost?'disabled':''}>${safe(sk.name)}<br>${skillBadge(sk)}<br><small>G${sk.cost} / ${['近','中','遠'][sk.range]}距離 / 威力${sk.power} / 命中${sk.accuracy>=0?'+':''}${sk.accuracy}</small></button>`).join('')}</div><p class="small muted">赤：ちから技（ちから参照）／青：かしこさ技（かしこさ参照）</p><h3>試合実況</h3><div class="battlefeed">${b.logs.map(x=>`<div>${safe(x)}</div>`).join('')}</div>`)}
function finishBattle(forfeit=false){if(!battle||battle.finished)return;stopBattleClock();battle.finished=true;const b=battle,m=state.monsters[state.active];const win=!forfeit&&(b.ehp<=0||(b.hp>0&&b.time===0&&b.hp/b.maxhp>b.ehp/b.maxehp));let prize=0,rankup=false;if(b.official){ensureBattleData();const d=state.battleData;if(win){d.wins++;prize=prizes[b.rank];state.money+=prize;if(d.rank===b.rank&&d.rank<5){d.rank++;rankup=true}else if(d.rank===5&&!d.champions.includes(m.name)){d.champions.push(m.name)}}else d.losses++;log(`${ranks[b.rank]}ランク大会：${win?'勝利':'敗北'}${prize?'。賞金'+prize+'G':''}`);m.fatigue=clamp(m.fatigue+18,0,100);m.stress=clamp(m.stress+(win?5:12),0,100);advance()}save();battle=null;document.getElementById('modal').classList.remove('wide');modal(`<h2>${win?'🏆 勝利！':'💥 敗北'}</h2><p>${safe(m.name)} ${win?'が試合に勝利しました！':'は健闘しました。'}</p>${b.official?`<div class="notice">賞金：${prize.toLocaleString()} G${rankup?'\n次のランクに昇格！':''}</div>`:'<p class="muted">練習試合のため週・育成状態は変わりません。</p>'}<button onclick="closeModal();render()" style="width:100%">ファームに戻る</button>`)}
function forfeitBattle(){if(!battle||battle.paused)return;if(confirm('この試合を棄権しますか？'))finishBattle(true)}
const originalCloseModal=closeModal;
closeModal=function(){if(battle&&!battle.finished)return;document.getElementById('modal').classList.remove('wide');originalCloseModal()};

init();
</script></body></html>
