.home-world:after{content:"";position:absolute;inset:auto 0 0;height:45%;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 130%,#00bafa44,transparent 61%)}
.home-topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:2}
.home-version{border:1px solid #a98963;border-radius:20px;padding:5px 15px;background:#101932b3;color:#d4e5ff;font-weight:800;font-size:.85rem}
.home-audio{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home-audio button{color:#e1eaff;background:#111c39cc;border:1px solid #7098d0;border-radius:11px;min-height:38px;padding:6px 12px;font-size:.85rem;font-weight:800}
.home-audio button[aria-pressed="true"]{border-color:#f4c96c;color:#ffe9b1;background:#4b3925ed}
.home-title{text-align:center;position:relative;margin:4px 0 2px;font-size:clamp(2rem,4.9vw,4rem);line-height:1.2;font-weight:950;letter-spacing:.045em;color:#ffefbb;-webkit-text-stroke:.4px #bd8d4c;text-shadow:0 3px 0 #5b3a21,0 6px 12px #000b,0 0 28px #32c0fa6b}
.home-subtitle{text-align:center;font-weight:800;font-size:clamp(.81rem,1.6vw,1.03rem);letter-spacing:.07em;color:#d2eafa;margin:6px 0 15px;text-shadow:0 2px 6px #000}
.home-arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px) minmax(0,1fr);align-items:center;min-height:390px;gap:8px}
.home-sides{min-width:0;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.home-side-icon{width:min(190px,91%);aspect-ratio:1/1;object-fit:contain;filter:drop-shadow(0 0 22px #20bdff65) drop-shadow(0 8px 16px #0008);animation:home-float 5.5s ease-in-out infinite}
.home-sides.right .home-side-icon{animation-delay:-2s}
.home-side-icon.small{width:min(128px,65%);animation-delay:-1.5s}
.home-grid-art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:min(205px,100%);padding:9px;border:1px solid #f6c66faa;border-radius:12px;background:#15294788;transform:perspective(450px) rotateY(12deg) rotateZ(-5deg);box-shadow:0 0 25px #4ce2fa23}
.home-sides.right .home-grid-art{transform:perspective(450px) rotateY(-12deg) rotateZ(5deg);border-color:#49a6e2aa}
.home-grid-art span{display:grid;place-items:center;aspect-ratio:1;background:linear-gradient(150deg,#1a3762,#223152);border:1px solid #89cdfbd9;border-radius:6px;font-size:clamp(.84rem,1.6vw,1.3rem);font-weight:900;color:#fff5da;text-shadow:0 0 9px #52cfff}
.home-actions{display:flex;flex-direction:column;gap:15px;position:relative;z-index:2;padding:8px}
.home-actions button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 15px;min-height:75px;border-radius:17px;border:2px solid #e1c687;font-weight:950;font-size:clamp(1rem,2.1vw,1.3rem);color:#fff7e2;text-shadow:0 2px 5px #000a;box-shadow:0 6px 0 #080d24,0 0 22px #0f7bc94d,inset 0 1px 0 #ffffff60;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
.home-actions button:hover{filter:brightness(1.17);transform:translateY(-2px)}
.home-actions button:active{transform:translateY(3px);box-shadow:0 2px 0 #080d24}
.home-actions .start{background:linear-gradient(155deg,#9a5b23,#5d301a 54%,#a16b2f);border-color:#ffdb84}
.home-actions .tutorial{background:linear-gradient(155deg,#1b6599,#183868 52%,#347ab0);border-color:#8cd5ff}
.home-actions .practice{background:linear-gradient(155deg,#255c97,#122e59 55%,#215c8c);border-color:#8bc9ec}
.home-actions .action-icon{font-size:1.55em;line-height:1}
.home-settings{margin-top:18px;background:linear-gradient(155deg,#182a47,#111a32);border:1px solid #4b6d99;border-radius:20px;box-shadow:0 8px 30px #03091a88;padding:24px}
.home-settings-heading{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:15px}
.home-settings-heading h2{margin:0;color:#ffdf9b;font-size:1.35rem}
.home-settings-desc{color:#a9c2e2;font-size:.86rem}
.home-settings .grid2{align-items:start}
.home-settings .pill{min-height:43px}
.home-settings .field{font-size:.9rem}
@keyframes home-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.home-side-icon{animation:none!important}.home-actions button{transition:none}}
@media(max-width:850px){.home-arena{grid-template-columns:minmax(0,1fr) minmax(250px,390px) minmax(0,1fr);min-height:345px}.home-actions button{min-height:67px}.home-sides{gap:11px}}

/* v0.1.24: make the player-count control visible before the start button. */
.home-count-picker{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;width:fit-content;max-width:100%;margin:12px auto 5px;padding:12px 20px;border-radius:18px;border:1px solid #cfa9668a;background:linear-gradient(110deg,#132d55e8,#20234deb);box-shadow:0 5px 20px #0005}
.home-count-caption{font-size:1rem;font-weight:900;color:#ffe3a9;white-space:nowrap}
.home-count-options{display:flex;gap:8px;align-items:center}
.home-count-options .pill{min-width:70px;min-height:46px;font-size:1.08rem;padding:9px 15px;background:#172d50;border:2px solid #6589bd;color:#f4f7ff}
.home-count-options .pill.active{background:linear-gradient(135deg,#f3ce7e,#c98f46);color:#21190d;border-color:#fff2b5;box-shadow:0 0 18px #ffce6b66}
.home-count-hint{font-size:.78rem;color:#b9d8f4}
@media(max-width:650px){.home-count-picker{padding:10px 9px;gap:6px 9px;width:100%}.home-count-caption{font-size:.91rem}.home-count-options .pill{min-width:62px;padding:8px 9px;font-size:1rem}.home-count-hint{flex-basis:100%;text-align:center;font-size:.73rem}}

/* v0.1.24: special title-only artwork; quiet battle screens remain unchanged */
.home-title-image{width:min(100%,850px);margin:1px auto 0;line-height:0;text-shadow:none;-webkit-text-stroke:0}
.home-title-image img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 13px #0009)}
.home-settings>.home-count-picker{margin:0 0 18px;width:100%;justify-content:flex-start;padding:10px 13px;box-shadow:none}
.home-actions button,.home-actions button.start,.home-actions button.tutorial,.home-actions button.practice{
  position:relative;isolation:isolate;overflow:visible;
  border:0;background:transparent;
  border-radius:14px;padding:12px 38px;min-height:84px;
  box-shadow:none;color:#fff6dc;font-size:clamp(1.2rem,2.2vw,1.48rem);
  text-shadow:0 2px 2px #10071c,0 3px 6px #070a22,0 0 12px #fff2cd70;
}
.home-actions button:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background-image:var(--button-art);background-size:100% 100%;background-repeat:no-repeat;
  filter:drop-shadow(0 5px 8px #000b);pointer-events:none
}
.home-actions button:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
.home-actions button:active:not(:disabled){transform:translateY(2px)}
.home-actions button:focus-visible{outline:3px solid #c6eaff;outline-offset:3px}
.home-button-label{position:relative;z-index:1;white-space:nowrap;letter-spacing:.08em}
@media(max-width:650px){
 .home-title-image{margin:12px auto 2px;width:100%}
 .home-actions button,.home-actions button.start,.home-actions button.tutorial,.home-actions button.practice{min-height:75px;font-size:1.2rem;padding:12px 22px}
 .home-settings>.home-count-picker{justify-content:center}
}

/* v0.1.25: tighten the space between the title artwork and main action buttons */
.home-title-image{margin:0 auto -10px;width:min(100%,810px)}
.home-subtitle{margin:2px 0 8px}
.home-arena{min-height:320px;gap:4px;align-items:start;margin-top:-4px}
.home-actions{padding:0;margin-top:0}
@media(max-width:850px){.home-arena{min-height:300px}}
@media(max-width:650px){.home-title-image{margin:8px auto -2px}.home-subtitle{margin:2px 0 8px}.home-arena{margin-top:0;gap:4px}.home-actions{margin:0 auto 12px}}

/* v0.1.24: quiet dedicated multiplayer settings */
.versus-settings{max-width:920px;margin:18px auto 0}
.versus-config{margin-top:16px}
.versus-settings .home-count-picker{margin:0 0 18px;width:100%;justify-content:flex-start;box-shadow:none}
.versus-settings .name-grid{margin-top:7px}
@media(max-width:650px){.versus-settings .home-count-picker{justify-content:center}.versus-settings .flex{gap:12px;flex-wrap:wrap}}

/* v0.1.26: balanced home composition only: responsive logo, ornaments and buttons */
.home-title-image{width:min(100%,780px);margin:0 auto -8px}
.home-subtitle{margin:2px 0 12px}
.home-arena{min-height:0;align-items:center;gap:clamp(8px,1.5vw,18px);margin:0 auto}
.home-sides{justify-content:center;gap:8px}
.home-side-icon{width:min(108px,76%)}
.home-side-icon.small{width:min(58px,43%)}
.home-grid-art{width:min(134px,100%);gap:4px;padding:6px}
.home-actions{padding:0;gap:10px;margin:0}
.home-actions button,.home-actions button.start,.home-actions button.tutorial,.home-actions button.practice{min-height:78px}
.home-world{padding-bottom:clamp(18px,2.5vw,29px)}
@media(max-width:850px){
 .home-arena{min-height:0;gap:8px}
 .home-side-icon{width:min(100px,80%)}
 .home-side-icon.small{width:min(54px,42%)}
 .home-grid-art{width:min(126px,100%)}
 .home-actions button,.home-actions button.start,.home-actions button.tutorial,.home-actions button.practice{min-height:75px}
}
@media(max-width:650px){
 .home-world{padding-bottom:14px}
 .home-title-image{width:100%;margin:7px auto -2px}
 .home-subtitle{margin:0 0 11px}
 .home-arena{display:block;min-height:0;margin:0}
 .home-actions{max-width:420px;margin:0 auto;gap:9px}
 .home-actions button,.home-actions button.start,.home-actions button.tutorial,.home-actions button.practice{min-height:74px}
}

/* v0.1.27: quiet, readable tactical interaction screens. Top page untouched. */
.game-setup{border-color:#445d82;background:linear-gradient(150deg,#182842,#121e33)}
.game-setup .section-title{margin-bottom:12px}
.game-setup .battle-rule-banner{min-height:0;padding:11px 15px;font-size:1.03rem;border-left-width:4px}
.game-setup .setup-opponents{margin:13px 0 2px}
.game-setup .setup-main-grid{align-items:start;gap:20px;margin-top:15px}
.game-setup .setup-board-heading{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:0 0 10px}
.game-setup .setup-board-heading h3{margin:0;font-size:1.1rem}
.game-setup .setup-mode-status{border:1px solid #4c769b;border-radius:999px;padding:5px 9px;color:#bddcf1;background:#172e49;font-size:.77rem;white-space:nowrap;font-weight:800}
.game-setup .setup-mode-status.mode-draw{color:#f6c7d4;border-color:#926177;background:#3a2739}
.game-setup .boardbox{padding:12px;border-color:#3f6182;background:#0e1c31}
.game-setup .cell{transition:background-color .14s,box-shadow .14s,border-color .14s,transform .14s;box-shadow:inset 0 1px 0 #ffffff17,0 3px 7px #0003}
.game-setup .cell.clickable:hover{transform:translateY(-1px)}
.game-setup .cell.selected{outline:0;border:2px solid #ffe0a2;background:linear-gradient(145deg,#655335,#3a3652);box-shadow:0 0 0 2px #dcae5488,0 0 17px #e4b95e37}
.game-setup .cell.redraw{outline:0;border:2px solid #f5a7b6;background:linear-gradient(145deg,#623d50,#303453);box-shadow:0 0 0 2px #be6c8e77}
.game-setup .cell:focus-visible{outline:3px solid #d6efff;outline-offset:2px}

function cpuChoose(p){

 if(state.cpuDifficulty==='easy'){p.choice=cpuRandomChoice(options);return;}
 const other=state.players.find(x=>x.id!==p.id);
 const possibilities=unused(other);
 if(!possibilities.length){p.choice=cpuRandomChoice(options);return;}
 if(state.cpuDifficulty==='ultimate'){cpuChooseUltimate(p,options,other,possibilities);return;}
 const me=stat(p.board,state.rule),difficulty=state.cpuDifficulty,hpMax=state.hpMax||100;
 const samples=difficulty==='ultimate'?150:difficulty==='hard'?55:16;
 const hypothetical=cpuHypotheticalBoards(p,samples);
 const scores=options.map(h=>{
  let total=0,totalWeight=0;
  for(const e of hypothetical)for(const enemyHand of possibilities){
   // Opponent hands are only public available possibilities. The current secret pick is never read.
   const win=(h+1)%3===enemyHand,lose=(enemyHand+1)%3===h,tie=h===enemyHand;
   const deal=(win||tie)?Math.min(other.hp[enemyHand],Math.max(0,me.atk[h]-e.def[enemyHand])):0;
   const taken=(lose||tie)?Math.min(p.hp[h],Math.max(0,e.atk[enemyHand]-me.def[h])):0;
   const knockOut=deal>=other.hp[enemyHand]&&deal>0;
   const myKnockOut=taken>=p.hp[h]&&taken>0;
   const enemyRemaining=possibilities.length;
   const myRemaining=options.length;
   let utility=deal/hpMax*(1.05+.12/(enemyRemaining))
    -taken/hpMax*(1.1+.18/(myRemaining))
    +(knockOut?.55:0)-(myKnockOut?.7:0)
    +(win?.16:lose?-.13:0);
   // Preserve a critical own hand if several alternatives are still available.

function remainingHandDecision(players=alivePlayers()){

function versusSettings(){
 const hpOpts=[100,200,300,400].map(v=>`<button type="button" class="pill ${state.hpMax===v?'active':''}" data-hp="${v}" aria-pressed="${state.hpMax===v}">${v} HP</button>`).join('');
 const nOpts=[2,3,4].map(v=>`<button type="button" class="pill ${state.n===v?'active':''}" data-count="${v}" aria-pressed="${state.n===v}">${v}人</button>`).join('');
 const fields=Array.from({length:state.n},(_,i)=>`<label class="field">プレイヤー${i+1}の名前<input class="txt" data-player-name="${i}" maxlength="16" placeholder="プレイヤー${i+1}" value="${esc(state.names[i])}" autocomplete="off"></label>`).join('');
 return `<section class="panel practice-settings versus-settings"><div class="flex" style="justify-content:space-between;align-items:center"><div><div class="eyebrow">LOCAL MULTIPLAYER</div><h1 class="practice-title">⚔ 対人戦の設定</h1></div><button type="button" class="btn soft" data-action="home">← トップへ戻る</button></div><p>人数・HP・ルール・名前を設定して対戦を始めます。対戦中は同じ端末を交代して使います。</p><div class="versus-config"><div class="home-count-picker" aria-label="対戦人数の設定"><span class="home-count-caption">対戦人数</span><div class="home-count-options">${nOpts}</div></div><div class="grid2"><div class="stack"><div><div class="label" style="margin-bottom:9px">各手の初期HP</div><div class="pill-row">${hpOpts}</div></div><div><div class="label" style="margin-bottom:9px">対戦ルール</div><div class="pill-row rule-mode-row"><button type="button" class="pill ${state.ruleMode==='normal'?'active':''}" data-rule-mode="normal" aria-pressed="${state.ruleMode==='normal'}">通常ルールのみ</button><button type="button" class="pill ${state.ruleMode==='special'?'active':''}" data-rule-mode="special" aria-pressed="${state.ruleMode==='special'}">特殊ルールあり</button></div></div></div><div><div class="label" style="margin-bottom:9px">プレイヤー名</div><div class="name-grid">${fields}</div></div></div><div class="revival-config"><div class="label" style="margin-bottom:9px">✨ 復活ルール</div><div class="pill-row"><button type="button" class="pill ${!state.revivalEnabled?'active':''}" data-revival="off" aria-pressed="${!state.revivalEnabled}">復活なし</button><button type="button" class="pill ${state.revivalEnabled?'active':''}" data-revival="on" aria-pressed="${state.revivalEnabled}">復活あり</button></div><p class="note">各プレイヤー1試合に1回、数字配置中にHP0の手をHP1で復活できます。復活した手は、その手を実際に出すまでほかのプレイヤーには秘密です。3手すべてHP0なら復活権があっても敗北です。</p></div></div><div style="margin-top:18px">${musicConfig()}</div><button type="button" class="btn gold large wide" style="margin-top:20px" data-action="start">⚔ 対戦スタート</button></section>`;
}
function practiceSettings(){
 const hpOpts=[100,200,300,400].map(v=>`<button class="pill ${state.practiceHp===v?'active':''}" data-practice-hp="${v}" aria-pressed="${state.practiceHp===v}">${v} HP</button>`).join('');
 const cpuOpts=[['easy','やさしい','気軽に練習'],['normal','ふつう','配置と手を考える'],['hard','つよい','攻防・HPを判断'],['ultimate','最強','戦況を読み長期戦で戦略切替']].map(([id,name,desc])=>`<button class="practice-difficulty ${state.cpuDifficulty===id?'active':''}" data-cpu-difficulty="${id}" aria-pressed="${state.cpuDifficulty===id}"><strong>${name}</strong><span>${desc}</span></button>`).join('');
 return `<section class="panel practice-settings"><div class="flex" style="justify-content:space-between;align-items:center"><div><div class="eyebrow">SOLO PRACTICE</div><h1 class="practice-title">🤖 一人で練習</h1></div><button class="btn soft" data-action="home">← トップへ戻る</button></div><p>CPUと1対1で練習できます。数字の配置やじゃんけんの駆け引きは対人戦と同じです。</p><div class="practice-config"><div class="stack"><label class="field">自分の名前<input class="txt" maxlength="16" placeholder="プレイヤー1" data-practice-name value="${esc(state.practiceName)}" autocomplete="off"></label><div><div class="label" style="margin-bottom:9px">各手の初期HP</div><div class="pill-row">${hpOpts}</div></div><div><div class="label" style="margin-bottom:9px">対戦ルール</div><div class="pill-row"><button class="pill ${state.practiceRuleMode==='normal'?'active':''}" data-practice-rule="normal" aria-pressed="${state.practiceRuleMode==='normal'}">通常ルールのみ</button><button class="pill ${state.practiceRuleMode==='special'?'active':''}" data-practice-rule="special" aria-pressed="${state.practiceRuleMode==='special'}">特殊ルールあり</button></div></div></div><div class="stack"><div><div class="label" style="margin-bottom:9px">CPUの強さ</div><div class="practice-difficulties">${cpuOpts}</div></div></div></div><div style="margin-top:18px">${musicConfig()}</div><button class="btn gold large wide" style="margin-top:20px" data-action="practice-start">⚔ CPUと練習スタート</button></section>`;

function expectedTripleProduct(cards){
 if(cards.length<3)return 0;
 let sum=0,count=0;
 for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++){
  sum+=cards[i]*cards[j]*cards[k];count++;
 }
 return sum/count;
}
// Scale estimated from random nine-card deals from the shared 0-9 x4 deck.
// These anchors represent approximate percentile ranks rather than a theoretical maximum.
const STRENGTH_PERCENTILES={
 normal:[[0,0],[22,5],[31,10],[44,20],[58,33],[78,50],[103,67],[129,80],[162,90],[192,95],[256,99],[450,100]],
 zero:[[0,0],[60,5],[74,10],[96,20],[120,33],[152,50],[188,67],[228,80],[275,90],[316,95],[401,99],[650,100]]
};
function strengthPercentile(value,zeroAwakening){
 const points=zeroAwakening?STRENGTH_PERCENTILES.zero:STRENGTH_PERCENTILES.normal;
 for(let i=1;i<points.length;i++){
  if(value<=points[i][0]){
   const [x0,y0]=points[i-1],[x1,y1]=points[i];
   return Math.max(0,Math.min(100,Math.round(y0+(y1-y0)*(value-x0)/(x1-x0))));
  }
 }
 return 100;
}

function guidedClick(hit){
 if(hit.dataset.tour==='exit'){state.screen='home';state.practice=false;render();return;}
 if(hit.dataset.tour==='restart'){initGuidedTutorial();return;}
 if(hit.dataset.tour==='next'){
   if(TOUR_STEPS[state.tutorialStep].act)return;
   if(state.tutorialStep===TOUR_STEPS.length-1){state.screen='home';state.practice=false;render();return;}
   guidedAdvance();return;
 }
 const k=state.tutorialStep;
 if(k===2&&hit.dataset.action==='mode-draw'){state.mode='draw';guidedAdvance();return;}
 if(k===3&&hit.dataset.slot!==undefined&&state.mode==='draw'){
   if(hit.dataset.slot!=='4'){
     const picked=player(0).board[Number(hit.dataset.slot)];
     state.tourNotice=`${picked}よりもっと小さい数字があります。いちばん小さい「1」を探してみましょう！`;
     render();return;
   }
   state.selectedDraw=[4];guidedAdvance();return;
 }
 if(k===4&&hit.dataset.action==='redraw'&&state.selectedDraw.includes(4)){
   const p=player(0);p.board[4]=state.drawPile.shift();p.redrawUsed++;state.selectedDraw=[];guidedAdvance();return;
 }
 if(k===7&&hit.dataset.action==='mode-move'){state.mode='move';state.selection=null;guidedAdvance();return;}
 if(k===8&&hit.dataset.slot!==undefined){
   const i=Number(hit.dataset.slot);
   if(state.selection===null){state.selection=i;render();}
   else if(state.selection!==i){
     const b=player(0).board;[b[i],b[state.selection]]=[b[state.selection],b[i]];
     state.selection=null;state.tourSwaps++;
     if(state.tourSwaps>=3)guidedAdvance();else {state.tourNotice=`${state.tourSwaps}回目の入れ替えができました。あと${3-state.tourSwaps}回、別の2枚を入れ替えてみましょう。`;render();}
   }
   return;
 }
 if(k===9&&hit.dataset.action==='setup-done'){state.selection=null;state.handSelection=null;guidedAdvance();return;}
 if(k===11&&hit.dataset.pick!==undefined){state.handSelection=Number(hit.dataset.pick);guidedAdvance();return;}
 if(k===12&&hit.dataset.action==='choose-done'&&state.handSelection!==null){player(0).choice=state.handSelection;guidedAdvance();return;}
 if(k===13&&hit.dataset.action==='pon'){playPonSound();guidedBattle();return;}
}

function hybridChannel(p,dc,host){p.raw=dc;dc.onopen=()=>{if(host)p.choose('rtc');};dc.onmessage=async e=>{try{await netReceive(p,JSON.parse(e.data));}catch(err){netFail(err.message);}};dc.onclose=()=>{if(p.transport==='WebRTC'&&net.active)netFail('WebRTC接続が切れました');};}
async function fbHost(){net.role='host';for(let i=0;i<12;i++){room=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);try{await fb.set(fbRef('/meta'),{host:fb.uid,created:fb.serverTimestamp()});break;}catch(e){room=null;if(i===11)throw e;}}await fb.onDisconnect(fbRef()).remove();const seen=new Set();fbWatch(fbRef('/requests'),async requests=>{for(const uid of Object.keys(requests||{})){if(seen.has(uid)||net.active||net.peers.length>=3)continue;seen.add(uid);const p=netPeer(net.peers.length+1);p.pc.onconnectionstatechange=null;let chosen=false;let timer; p.choose=async mode=>{if(chosen)return;chosen=true;clearTimeout(timer);try{if(mode==='rtc'){p.transport='WebRTC';p.dc=p.raw;}else{p.pc.close();relay(p,uid,true);}await fb.set(fbRef('/transport/'+uid),mode);render();}catch(e){netFail(e.message);}};timer=setTimeout(()=>p.choose('relay'),18000);try{hybridChannel(p,p.pc.createDataChannel('janken'),true);await p.pc.setLocalDescription(await p.pc.createOffer());await netGather(p.pc);if(chosen)continue;await fb.set(fbRef('/offers/'+uid),JSON.stringify(p.pc.localDescription));let applied=false;fbWatch(fbRef('/answers/'+uid),async answer=>{if(answer&&!applied&&!chosen){applied=true;try{await p.pc.setRemoteDescription(JSON.parse(answer));}catch(e){p.choose('relay');}}});}catch(e){await p.choose('relay');}render();}});net.status='参加者を待っています';render();}
async function fbJoin(code){room=code;const meta=(await fb.get(fbRef('/meta'))).val();if(!meta)throw Error('ルームがありません');net.role='join';const p=netPeer(0);p.pc.onconnectionstatechange=null;let applied=false,selected=false; p.pc.ondatachannel=e=>hybridChannel(p,e.channel,false);fbWatch(fbRef('/transport/'+fb.uid),async mode=>{if(!mode||selected)return;selected=true;if(mode==='relay'){p.pc.close();relay(p,fb.uid,false);}else{p.transport='WebRTC';const ready=()=>{p.dc=p.raw;netSend(p,{t:'hello',name:net.name});net.status='WebRTC通信で接続';render();};if(p.raw?.readyState==='open')ready();else {let n=0;const t=setInterval(()=>{if(p.raw?.readyState==='open'){clearInterval(t);ready();}else if(++n>100){clearInterval(t);netFail('WebRTC接続待ちタイムアウト');}},100);}}});fbWatch(fbRef('/offers/'+fb.uid),async offer=>{if(!offer||applied||selected)return;applied=true;try{await p.pc.setRemoteDescription(JSON.parse(offer));await p.pc.setLocalDescription(await p.pc.createAnswer());await netGather(p.pc);if(!selected)await fb.set(fbRef('/answers/'+fb.uid),JSON.stringify(p.pc.localDescription));}catch(e){if(!selected){net.status='Firebase切替待ち';render();}}});await fb.set(fbRef('/requests/'+fb.uid),true);await fb.onDisconnect(fbRef('/requests/'+fb.uid)).remove();net.status='WebRTC優先接続を試行中';render();}
app.addEventListener('click',async e=>{const a=e.target.closest('[data-fb]')?.dataset.fb;if(!a||fbBusy)return;e.stopImmediatePropagation();fbBusy=true;try{if(a==='exit'){if(net.role==='host')await fb.remove(fbRef());else await fb.remove(fbRef('/requests/'+fb.uid));location.reload();return;}const code=document.getElementById('fb-code')?.value.trim();net.name=document.getElementById('net-name')?.value.trim()||net.name||'プレイヤー';if(a==='join-open'){fbJoining=true;net.status='';render();return;}if(a==='back'){if(fbJoining){fbJoining=false;net.status='';}else state.screen='home';render();return;}if(a==='join'&&!/^\d{6}$/.test(code))throw Error('6桁の番号を入力してください');await fbInit();if(a==='host')await fbHost();else await fbJoin(code);}catch(e){room=null;net.role=null;fbError(e);}finally{fbBusy=false;}},true);


render();
</script>
