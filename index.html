<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数式モンスターファーム</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#f4f4e8;background:#101e2a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#102739,#213b32);min-height:100vh}header{background:#10202adf;padding:15px max(14px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #b4a064}h1{font-size:clamp(19px,3vw,28px);margin:0;color:#ffe7a2}h2{font-size:20px;margin:0 0 14px;color:#ffe7a2}h3{margin:6px 0}.wrap{max-width:1080px;margin:auto;padding:18px 14px 60px}.panel{background:#172c36ee;border:1px solid #48636b;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 20px #07121b40}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#b6c9c8}.small{font-size:13px}.pill{background:#365a59;border-radius:30px;padding:5px 11px;display:inline-block;font-size:13px}button,input,select{font:inherit}button{background:#e5bb64;color:#202a2a;border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:750;transition:.15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#3a5965;color:white}.danger{background:#b85755;color:white}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{text-align:left;min-height:77px}.action span{display:block;font-weight:400;font-size:12px;opacity:.83;margin-top:4px}input,select{background:#f7f5e9;color:#1b2930;border:2px solid #b8bfae;border-radius:9px;padding:12px;width:100%;margin:6px 0 12px}label{display:block;font-weight:700}.stat{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:14px}.track{height:11px;border-radius:10px;background:#30444b;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#5bb8b0,#d6dc84)}.monster{font-size:110px;text-align:center;filter:drop-shadow(0 12px 5px #09151a88);line-height:1.35;animation:bob 2.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.ranch{background:radial-gradient(ellipse at 50% 110%,#55794a 0%,#345849 48%,#213b4a 90%);border-radius:15px;padding:20px 10px 12px;min-height:185px;text-align:center}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{border:2px solid #4b6870;border-radius:12px;padding:12px;cursor:pointer;text-align:center;background:#233c46}.choice.active{border-color:#ffe7a2;background:#405c53}.choice .emoji{font-size:43px}.log{max-height:175px;overflow:auto;font-size:13px;color:#d5e2df}.log p{border-bottom:1px solid #344d56;padding-bottom:8px}.overlay{position:fixed;inset:0;background:#06131ce9;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{width:min(100%,560px);max-height:94vh;overflow:auto;background:#203943;border:2px solid #d7b971;border-radius:20px;padding:25px;box-shadow:0 20px 90px #000a}.question{font-size:clamp(25px,5vw,40px);text-align:center;margin:22px 0;font-weight:800;color:#fff0bc}.notice{padding:12px;background:#334b50;border-radius:10px;margin:12px 0;white-space:pre-wrap}.hidden{display:none!important}.topbuttons{display:flex;gap:8px;flex-wrap:wrap}footer{text-align:center;color:#9cb7b7;font-size:12px;padding:15px}@media(max-width:740px){.grid{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}.monster{font-size:90px}header{align-items:flex-start;flex-direction:column}.panel{padding:14px}}
</style><style>
.battlebar{height:12px;background:#30444b;border-radius:12px;overflow:hidden;margin:6px 0}.battlebar>div{height:100%;background:#64c69b}.battlebar.enemy>div{background:#e37d6b}.arena{background:linear-gradient(#294653,#274c3d);border-radius:14px;padding:16px;text-align:center}.fighters{display:flex;justify-content:space-around;font-size:76px}.battlebuttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.battlebuttons button{font-size:14px}.battlefeed{max-height:110px;overflow:auto;font-size:13px;background:#142b35;padding:10px;border-radius:8px}.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rankline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;padding:10px;background:#25424b;border-radius:9px}.modal.wide{width:min(100%,740px)}
.skill-type{display:inline-block;border-radius:5px;padding:3px 7px;font-size:12px;font-weight:800;margin:4px 0}.skill-power{background:#8e4038;color:#fff0e9}.skill-wisdom{background:#255e93;color:#e9f7ff}.battlebuttons button{line-height:1.4}</style></head><body><header><h1>✦ 数式モンスターファーム</h1><div class="topbuttons"><button class="secondary" onclick="save(true)">保存</button><button class="secondary" onclick="exportSave()">バックアップ</button><button class="secondary" onclick="document.getElementById('importFile').click()">読込</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importSave(event)"></div></header><main class="wrap"><div id="app"></div></main><footer>ブラウザに自動保存されます。バックアップファイルも定期的に保存してください。</footer><div id="overlay" class="overlay hidden"><div id="modal" class="modal"></div></div><script>
'use strict';const KEY='mathMonsterFarm.phase1.v1';const species=[{id:'flare',name:'フレアドラゴン',icon:'🐲',type:'ちから型',growth:[1.1,1.35,.65,.9,.85,1],life:180},{id:'aqua',name:'アクアドラゴン',icon:'🐉',type:'かしこさ型',growth:[1, .75,1.4,1.1,.95,.8],life:192},{id:'rock',name:'ロックゴーレム',icon:'🗿',type:'丈夫さ型',growth:[1.2,1.15,.65,.7,.55,1.5],life:205},{id:'leaf',name:'リーフィー',icon:'🌱',type:'長寿型',growth:[1.2,.7,1.2,.95,1.1,.9],life:230},{id:'ghost',name:'ファントム',icon:'👻',type:'回避型',growth:[.7,.75,1.25,1.2,1.5,.55],life:185},{id:'bolt',name:'ボルトフォックス',icon:'🦊',type:'命中型',growth:[.9,1.05,1,1.5,1.3,.65],life:180}];const names=['ライフ','ちから','かしこさ','命中','回避','丈夫さ'];const jobs=[{name:'走り込み',stat:0,stress:4,fatigue:10,desc:'ライフを伸ばす軽仕事'},{name:'重り運び',stat:1,stress:5,fatigue:12,desc:'ちからを伸ばす軽仕事'},{name:'数学研究',stat:2,stress:4,fatigue:10,desc:'かしこさを伸ばす軽仕事'},{name:'的当て',stat:3,stress:5,fatigue:11,desc:'命中を伸ばす軽仕事'},{name:'障害物回避',stat:4,stress:5,fatigue:11,desc:'回避を伸ばす軽仕事'},{name:'岩運び',stat:5,stress:6,fatigue:12,desc:'丈夫さを伸ばす軽仕事'},{name:'高速計算',stat:3,other:2,heavy:true,stress:13,fatigue:23,desc:'命中・かしこさを大きく伸ばす'},{name:'数式特訓',stat:2,other:1,heavy:true,stress:14,fatigue:25,desc:'かしこさ・ちからを大きく伸ばす'},{name:'高速障害物訓練',stat:4,other:3,heavy:true,stress:14,fatigue:25,desc:'回避を大きく・命中も伸ばす重仕事'},{name:'鉄壁防御訓練',stat:5,other:0,heavy:true,stress:15,fatigue:26,desc:'丈夫さを大きく・ライフも伸ばす重仕事'}];let state=null;let pending=null;let selected=0;let question=null;let locked=false;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(x,a,b){return Math.min(b,Math.max(a,x))}function spec(m){return species.find(s=>s.id===m.species)||species[0]}function growthAptitude(m){const main=spec(m).growth;const sub=species.find(s=>s.id===m.subSpecies);return sub?main.map((v,i)=>v*.8+sub.growth[i]*.2):main}function growthAptitudeForFusion(a,b){return spec(a).growth.map((v,i)=>v*.8+spec(b).growth[i]*.2)}function yearWeek(w){return `${Math.floor(w/48)+1}年 ${Math.floor((w%48)/4)+1}月 第${w%4+1}週`}function stage(m){let r=m.age/m.lifespan;return r<.15?'幼年期':r<.35?'成長期':r<.65?'最盛期':r<.82?'成熟期':'晩年期'}function condition(m){const burden=Math.max(m.fatigue,m.stress)*.65+(m.fatigue+m.stress)*.175;return burden>=85?'危険':burden>=65?'要休養':burden>=40?'やや疲れ':'元気'}function growth(m){let r=m.age/m.lifespan;return r<.15?.55:r<.35?1:r<.65?1.5:r<.82?.9:.5}function log(t){state.logs.unshift(`${yearWeek(state.week)}：${t}`);state.logs=state.logs.slice(0,35)}function save(show=false){if(state){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)alert('保存しました。')}catch(e){alert('保存に失敗しました。バックアップを利用してください。')}}}function init(){try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&v.version===1&&Array.isArray(v.monsters)&&Number.isFinite(v.week)){state=v}}}catch(e){}render()}
function makeMonster(id,name){const s=species.find(x=>x.id===id);return {id:Date.now()+Math.random(),species:id,name:name.trim().slice(0,16)||s.name,stats:s.growth.map(x=>Math.round(65+40*x+rand(0,25))),age:0,lifespan:s.life+rand(-12,12),fatigue:0,stress:0,loyalty:55,history:[],retired:false}}function start(){let name=document.getElementById('monsterName').value;state={version:1,week:0,money:5000,monsters:[makeMonster(species[selected].id,name)],active:0,logs:[],records:[],answers:{correct:0,total:0},level:document.getElementById('level').value};log('ファームが始まりました。新しいモンスターが誕生！');save();render()}

function renderNextGoals(m){
 const total=m.stats.reduce((a,b)=>a+b,0),rank=state.battleData?.rank||0;
 const milestones=[500,1000,1500,2000,2500,3000,4000,5000];
 const target=milestones.find(v=>total<v);
 const currentRank=['E','D','C','B','A','S'][Math.min(rank,5)];
 const nextRank=['D','C','B','A','S'][rank];
 const progress=(v,max)=>`<div class="track" style="margin:7px 0 12px"><div class="fill" style="width:${Math.min(100,Math.round(v/max*100))}%"></div></div>`;
 let html='';
 if(target){html+=`<p><b>育成目標：能力合計 ${target.toLocaleString()}</b></p><p class="small muted">現在 ${total.toLocaleString()} / ${target.toLocaleString()}（あと ${(target-total).toLocaleString()}）</p>${progress(total,target)}`;}
 else {html+=`<p><b>育成目標達成！ 合計 ${total.toLocaleString()}</b></p><p class="small muted">6能力の上限999を目指そう。</p>`;}
 if(rank<5){html+=`<p><b>大会目標：${nextRank}ランク昇格</b></p><p class="small muted">現在 ${currentRank}ランク。毎月第4週の公式大会で勝利しよう。</p>`;}
 else {
  const majors=state.p4?.majors||[];
  if(majors.length<4)html+=`<p><b>大会目標：四大大会制覇 ${majors.length}/4</b></p><p class="small muted">Sランク到達！ 未制覇の四大大会に挑戦しよう。</p>${progress(majors.length,4)}`;
  else html+=`<p><b>大会目標：四大大会制覇達成！</b></p><p class="small muted">殿堂入りと次世代育成を目指そう。</p>`;
 }
 const useCount=typeof battleSkills!=='undefined'&&Array.isArray(battleSkills)?battleSkills.length:0;
 if(m.age<48)html+=`<p class="small muted">🌱 成長の序盤：仕事を通じて得意能力を見つけよう。</p>`;
 else if(m.age/m.lifespan>.75)html+=`<p class="small muted">🌙 晩年期：大会記録を残し、冬眠・合体・世代交代も検討しよう。</p>`;
 else if(total>=1500)html+=`<p class="small muted">🔥 育成の中盤：修行で技を覚え、得意距離を伸ばそう。</p>`;
 return html;
}
function render(){const app=document.getElementById('app');if(!state){app.innerHTML=`<section class="panel"><h2>モンスターを誕生させよう</h2><p class="muted">毎週1回の仕事で数学問題に挑戦。能力を伸ばしながら寿命のあるモンスターを育てよう。</p><div class="six">${species.map((s,i)=>`<div class="choice ${selected===i?'active':''}" onclick="selectSpecies(${i})"><div class="emoji">${s.icon}</div><b>${s.name}</b><div class="small muted">${s.type}</div></div>`).join('')}</div><p><label for="monsterName">モンスターの名前</label><input id="monsterName" maxlength="16" placeholder="名前を入力（省略可）"></p><label for="level">数学の難易度</label><select id="level"><option value="elementary">小学生</option><option value="junior" selected>中学生</option><option value="high">高校生</option></select><button onclick="start()" style="width:100%">育成をはじめる</button></section>`;return}const m=state.monsters[state.active];if(!m){app.innerHTML=`<div class="panel"><h2>育成するモンスターがいません</h2><p>次のモンスターを迎えて、新しい世代の育成を始めましょう。</p><button onclick="newMonster()">新しいモンスターを迎える</button></div><div class="panel"><h2>育成記録</h2>${state.records.map(r=>`<p>${safe(r.name)} / ${safe(r.species)} / ${r.age}週 / 合計能力 ${r.total}</p>`).join('')||'まだ記録がありません'}</div>`;return}const s=spec(m);app.innerHTML=`<div class="grid"><div><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="pill">📅 ${yearWeek(state.week)}</span><span class="pill">💰 ${state.money.toLocaleString()} G</span></div><div class="ranch"><div class="monster">${s.icon}</div><h2 style="margin:0">${safe(m.name)}</h2><span class="small">${s.name} / ${stage(m)}</span></div><p class="small muted">年齢：${Math.floor(m.age/48)}歳 ${Math.floor(m.age%48/4)}か月 / 忠誠度 ${m.loyalty}</p>${names.map((n,i)=>`<div class="stat"><span>${n}</span><div class="track"><div class="fill" style="width:${m.stats[i]/999*100}%"></div></div><b>${m.stats[i]}</b></div>`).join('')}<div class="small muted">体調：<b>${condition(m)}</b>　疲労 ${m.fatigue}/100　ストレス ${m.stress}/100</div><div class="small muted">数学の正答率 ${state.answers.total?Math.round(state.answers.correct/state.answers.total*100):0}%（${state.answers.correct}/${state.answers.total}）</div></section><section class="panel"><h2>ファームの記録</h2><div class="log">${state.logs.map(x=>`<p>${safe(x)}</p>`).join('')}</div></section></div><div><section class="panel"><h2>今週の育成</h2><p class="muted small">仕事を選ぶと数学問題が1問出題されます。正解で成長ボーナス！</p><div class="actions">${jobs.map((j,i)=>`<button class="secondary action" onclick="beginJob(${i})">${j.heavy?'🔥':'🌿'} ${j.name}<span>${j.desc} / 疲労+${j.fatigue}</span></button>`).join('')}</div></section><section class="panel"><h2>休養・生活</h2><div class="actions"><button onclick="rest()">💤 休養<span class="small" style="display:block">疲労-40、ストレス-20</span></button><button onclick="feed()">🍎 おやつ 300G<span class="small" style="display:block">ストレス-18、忠誠度+3 / 1週</span></button><button class="secondary" onclick="changeLevel()">📚 数学レベル変更</button><button class="secondary" onclick="showRecords()">🏅 育成記録</button></div><p class="small muted">行動1回で1週間経過。体調は疲労・ストレスから判定。各値が65を超えると寿命が追加減少し、86以上では減少が増えます。</p></section><section class="panel"><h2>次の目標</h2>${renderNextGoals(m)}<button class="danger" onclick="retireAsk()">モンスターを引退させる</button></section></div></div>`}
function selectSpecies(i){selected=i;const v=document.getElementById('monsterName')?.value||'';const lev=document.getElementById('level')?.value||'junior';render();document.getElementById('monsterName').value=v;document.getElementById('level').value=lev}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.remove('hidden')}function closeModal(){document.getElementById('overlay').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function makeQuestion(level){let a,b,c,x,txt,ans;if(level==='elementary'){let k=rand(0,3);if(k===0){a=rand(12,90);b=rand(11,65);txt=`${a} + ${b} = ?`;ans=a+b}else if(k===1){a=rand(30,99);b=rand(5,a);txt=`${a} − ${b} = ?`;ans=a-b}else if(k===2){a=rand(3,12);b=rand(3,12);txt=`${a} × ${b} = ?`;ans=a*b}else{b=rand(2,12);ans=rand(2,12);txt=`${b*ans} ÷ ${b} = ?`}}else if(level==='junior'){let k=rand(0,3);if(k===0){x=rand(-12,12);a=rand(2,8);b=rand(-15,15);txt=`${a}x ${b<0?'−':'+'} ${Math.abs(b)} = ${a*x+b}　の x = ?`;ans=x}else if(k===1){a=rand(-15,15);b=rand(-15,15);txt=`(${a}) × (${b}) = ?`;ans=a*b}else if(k===2){x=rand(-8,8);a=rand(2,7);b=rand(-10,10);txt=`${a}(x ${b<0?'−':'+'} ${Math.abs(b)}) = ${a*(x+b)}　の x = ?`;ans=x}else{a=rand(2,12);b=rand(2,12);txt=`${a*a} − ${b*b} = ?`;ans=a*a-b*b}}else{let k=rand(0,3);if(k===0){a=rand(-8,8);b=rand(-8,8);txt=`f(x) = x² ${a<0?'−':'+'} ${Math.abs(a)}x ${b<0?'−':'+'} ${Math.abs(b)}　の f(2) = ?`;ans=4+2*a+b}else if(k===1){a=rand(1,7);b=rand(-8,8);txt=`y = ${a}x² ${b<0?'−':'+'} ${Math.abs(b)}　の最小値は？`;ans=b}else if(k===2){a=rand(2,9);b=rand(2,9);txt=`数列 ${a}, ${a+b}, ${a+2*b}, ... の第10項は？`;ans=a+9*b}else{a=rand(2,8);b=rand(2,8);txt=`(x + ${a})(x + ${b}) の x の係数は？`;ans=a+b}}return {txt,ans}}
function beginJob(i){if(!state?.monsters[state.active])return;pending={job:i};question=makeQuestion(state.level);locked=false;modal(`<h2>📘 ${jobs[i].name} — 数学チャレンジ</h2><p class="muted">正解すると成長ボーナス。不正解でも仕事に挑戦できます。</p><div class="question">${safe(question.txt)}</div><form id="answerForm"><label for="answer">答えを数値で入力</label><input id="answer" type="text" required autocomplete="off" inputmode="text" pattern="[+\-−－]?[0-9０-９]+([.．][0-9０-９]+)?" placeholder="数値を入力"><button type="button" onclick="insertMinus('answer')">− マイナスを入力</button><button type="submit" style="width:100%">解答する</button></form><p class="small muted">問題中に時間制限はありません。</p>`);document.getElementById('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer()};document.getElementById('answer').focus()}
function insertMinus(id){const el=document.getElementById(id);if(!el)return;el.value=el.value.startsWith("-")?el.value.slice(1):"-"+el.value.replace(/^[+−－]/,"");el.focus()}
function parseMathNumber(s){return Number(String(s).trim().replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/[−－]/g,"-").replace(/．/g,"."))}
function submitAnswer(){if(locked||!question||!pending)return;const v=parseMathNumber(document.getElementById('answer').value);if(!document.getElementById('answer').value.trim()||!Number.isFinite(v))return;locked=true;const correct=Math.abs(v-question.ans)<1e-8;state.answers.total++;if(correct)state.answers.correct++;const j=jobs[pending.job],m=state.monsters[state.active],apt=growthAptitude(m),fail=Math.random()<clamp((m.fatigue-55)/180+(m.stress-65)/250+(65-m.loyalty)/500,.02,.55);let report;if(fail){report=`${m.name}は仕事に失敗した。能力は上がらなかった。`;m.loyalty=clamp(m.loyalty-2,0,100)}else{let amount=Math.max(1,Math.round((j.heavy?13:8)*apt[j.stat]*growth(m)*(correct?1.3:1)*(.9+Math.random()*.25)));m.stats[j.stat]=clamp(m.stats[j.stat]+amount,0,999);report=`${names[j.stat]}が +${amount} 上昇！`;if(j.other!==undefined){const extra=Math.max(1,Math.round(amount*.48*apt[j.other]));m.stats[j.other]=clamp(m.stats[j.other]+extra,0,999);report+=` ${names[j.other]}も +${extra}！`}m.loyalty=clamp(m.loyalty+1,0,100)}m.fatigue=clamp(m.fatigue+j.fatigue,0,100);m.stress=clamp(m.stress+j.stress,0,100);log(`${j.name}：${correct?'正解':'不正解'}。${report}`);const message=`${correct?'🎉 正解！':'📖 不正解'}　正解は ${question.ans} です。\n${report}`;pending=null;question=null;advance();save();modal(`<h2>${correct?'数学チャレンジ成功！':'数学チャレンジ終了'}</h2><div class="notice">${safe(message)}</div><button onclick="closeModal();render()" style="width:100%">ファームに戻る</button>`)}

function p4Modal(title,content){modal(`<h2>${title}</h2>${content}<p><button class="secondary" onclick="closeModal();render()">ファームに戻る</button></p>`)}
function showFusion(){phase4Init();const m=state.monsters[state.active],pool=[...(m?[m]:[]),...state.frozen];p4Modal('🧬 合体・サブ種族',`<p class="small muted">育成中と冬眠中から2体を選択。親2体は合体後にいなくなります。初期能力は親の実能力を継承し、成長適性は親Aのメイン種族80%＋親Bのメイン種族20%で決定（過去の合体補正は累積しません）。費用2000G。</p>${pool.length<2?'<p>合体には2体必要です。冬眠保管庫にモンスターを増やしてください。</p>':`<label>親A</label><select id="fusionA">${pool.map((x,i)=>`<option value="${i}">${safe(x.name)}（${safe(spec(x).name)}）</option>`).join('')}</select><label>親B</label><select id="fusionB">${pool.map((x,i)=>`<option value="${i}" ${i===1?'selected':''}>${safe(x.name)}（${safe(spec(x).name)}）</option>`).join('')}</select><label>子の名前</label><input id="fusionName" maxlength="16" placeholder="新しいモンスター"><button onclick="performFusion()" ${state.money<2000?'disabled':''}>2000Gで合体</button>`}`)}
function performFusion(){phase4Init();const pool=[...(state.monsters[state.active]?[state.monsters[state.active]]:[]),...state.frozen],a=Number(document.getElementById('fusionA')?.value),b=Number(document.getElementById('fusionB')?.value);if(a===b||!pool[a]||!pool[b]||state.money<2000){alert('異なる親を2体選んでください。');return}if(!confirm('親2体を消費して合体します。元に戻せません。よろしいですか？'))return;const A=pool[a],B=pool[b],name=document.getElementById('fusionName').value;const child=makeMonster(A.species,name||spec(A).name);phase4Monster(child);child.subSpecies=B.species;child.generation=Math.max(A.generation||1,B.generation||1)+1;child.parents=[A.name,B.name];child.stats=child.stats.map((v,i)=>clamp(Math.round(v+(A.stats[i]+B.stats[i])*.115),0,999));child.lifespan=Math.round((spec(A).life+spec(B).life)/2)+rand(-8,8);child.unlockedSkills=[...new Set([0,2,4,...A.unlockedSkills.filter(x=>x<6),...B.unlockedSkills.filter(x=>x<6)])];child.skillUses={};state.frozen=state.frozen.filter(x=>x!==A&&x!==B);state.monsters=state.monsters.filter(x=>x!==A&&x!==B);state.monsters.push(child);state.active=state.monsters.length-1;state.money-=2000;state.p4.fusionCount++;log(`${A.name}と${B.name}から第${child.generation}世代の${child.name}が誕生！`);save();closeModal();render()}
function showExpedition(){phase4Init();const m=state.monsters[state.active];p4Modal('🗺️ 探検・遺跡探索',m?`<p class="muted">探索は4週間。数学問題に正解すると成功率が上昇。能力に応じて珍しい発見があります。</p>${expeditions.map((x,i)=>`<div class="notice"><b>${x.name}</b> / ${x.fee}G<br><small>${names[x.stat]}${x.min}以上推奨 / 現在${m.stats[x.stat]}</small><p><button onclick="beginExpedition(${i})" ${state.money<x.fee?'disabled':''}>探索する</button></p></div>`).join('')}`:'<p>育成中のモンスターが必要です。</p>')}
let expeditionPending=null;
function beginExpedition(i){const x=expeditions[i];if(!state?.monsters[state.active]||state.money<x.fee)return;expeditionPending=i;question=makeQuestion(state.level);modal(`<h2>${x.name}：数学の仕掛け</h2><div class="question">${safe(question.txt)}</div><form id="expeditionForm"><input id="expeditionAnswer" type="text" inputmode="text" required placeholder="数値を入力"><button type="button" onclick="insertMinus('expeditionAnswer')">− マイナス</button><button type="submit">仕掛けを解く</button></form><button class="secondary" onclick="expeditionPending=null;closeModal()">キャンセル</button>`);document.getElementById('expeditionForm').onsubmit=e=>{e.preventDefault();finishExpedition()}}
function finishExpedition(){if(expeditionPending===null||!question)return;const f=document.getElementById('expeditionAnswer'),n=parseMathNumber(f.value);if(!f.value.trim()||!Number.isFinite(n))return;phase4Init();const x=expeditions[expeditionPending],m=state.monsters[state.active],correct=Math.abs(n-question.ans)<1e-8;state.answers.total++;if(correct)state.answers.correct++;m.mathHistory.push({txt:question.txt,ans:question.ans,answer:n,correct,week:state.week,kind:'探検'});state.money-=x.fee;const success=Math.random()<clamp(.3+m.stats[x.stat]/1700+(correct?.24:0),.1,.95);let msg;if(success){const reward=rand(1100,2600)*(expeditionPending+1);state.money+=reward;msg=`探索成功！ ${reward}Gを発見。`;const find=`${x.name}の古代紋章`;if(!state.p4.discoveries.includes(find)){state.p4.discoveries.push(find);msg+=` 新発見「${find}」！`}}else msg='探索失敗。遺跡から帰還した。';m.fatigue=clamp(m.fatigue+25,0,100);m.stress=clamp(m.stress+12,0,100);for(let j=0;j<4&&state.monsters.includes(m);j++)advance();state.p4.expeditions++;log(msg);expeditionPending=null;question=null;save();modal(`<h2>探検結果</h2><p>${safe(msg)}</p><button onclick="closeModal();render()">戻る</button>`)}
function showMajors(){phase4Init();const d=state.battleData||{rank:0};p4Modal('🏆 四大大会・殿堂',`<p>四大大会制覇：${state.p4.majors.length}/4　殿堂入り：${state.p4.hall.length}体</p><p class="small muted">Sランク到達で挑戦可能。公式大会と同じく月の第4週のみ。勝利で賞金と称号を獲得。</p>${fourMajors.map((x,i)=>`<div class="notice"><b>${x.name}</b> ${state.p4.majors.includes(x.name)?'🏅制覇済み':''}<br><small>賞金${x.reward}G</small><p><button onclick="startMajor(${i})" ${d.rank<5||!availableTournament()||!state.monsters[state.active]?'disabled':''}>挑戦</button></p></div>`).join('')}<h3>殿堂入り</h3>${state.p4.hall.map(x=>`<p>${safe(x.name)} / 合計能力${x.stats.reduce((a,b)=>a+b,0)}</p>`).join('')||'<p class="muted">まだいません。</p>'}`)}
function startMajor(i){if(!state?.monsters[state.active]||state.battleData?.rank<5||!availableTournament())return;closeModal();startBattle(true);if(battle){battle.majorIndex=i;battle.enemy.stats=battle.enemy.stats.map(v=>clamp(Math.round(v*1.2),0,999));battle.enemy.name=fourMajors[i].name+' 王者';battle.ehp=battle.enemy.stats[0]+100;battle.maxehp=battle.ehp;showBattle()}}
function showFacilities(){phase4Init();p4Modal('🏡 ファーム施設拡張',`<p>所持金：${state.money}G</p>${facilities.map(f=>{const lv=state.p4.facilities[f.id]||0;return `<div class="notice"><b>${f.name} Lv.${lv}/3</b><br><small>${f.desc}</small><p><button onclick="upgradeFacility('${f.id}')" ${lv>=3||state.money<f.cost[lv]?'disabled':''}>${lv>=3?'最大レベル':f.cost[lv]+'Gで強化'}</button></p></div>`}).join('')}`)}
function upgradeFacility(id){const f=facilities.find(x=>x.id===id),lv=state.p4.facilities[id]||0;if(!f||lv>=3||state.money<f.cost[lv])return;state.money-=f.cost[lv];state.p4.facilities[id]++;log(`${f.name}をLv.${lv+1}に強化した。`);save();showFacilities()}
const p4OldRest=rest;rest=function(){if(state?.monsters[state.active]){phase4Init();const m=state.monsters[state.active],lv=state.p4.facilities.rest||0;m.fatigue=clamp(m.fatigue-lv*8,0,100);m.stress=clamp(m.stress-lv*4,0,100)}p4OldRest()};
function showAssistant(){phase4Init();const m=state.monsters[state.active];if(!m)return p4Modal('💬 育成助手','<p>育成中のモンスターがいません。</p>');const ratio=m.age/m.lifespan;let lines=[];if(m.fatigue>=65)lines.push('かなり疲れています。休養や元気草がおすすめです。');else if(m.fatigue>=40)lines.push('少し疲れています。無理をしないようにしましょう。');else lines.push('体力面は良好です。');if(m.stress>=65)lines.push('ストレスが高く、寿命を縮める危険があります。');if(ratio>.87)lines.push('最近は年齢を感じます。引退や冬眠も考えましょう。');else if(ratio>=.35&&ratio<.65)lines.push('成長の最盛期です。重仕事が効果的です。');if(m.loyalty<45)lines.push('忠誠度が低めです。育成方針を見直しましょう。');lines.push(`今の体調は「${condition(m)}」。疲労${m.fatigue}・ストレス${m.stress}です。`);p4Modal('💬 育成助手',lines.map(x=>`<div class="notice">${safe(x)}</div>`).join(''))}
function showBestiary(){phase4Init();const all=[...state.monsters,...state.frozen],records=state.p4.library;p4Modal('📚 モンスター図鑑・育成記録',`<h3>種族図鑑</h3>${species.map(s=>`<div class="notice">${s.icon} <b>${s.name}</b> / ${s.type}　育成履歴：${[...all,...records].filter(x=>x.species===s.id).length}体</div>`).join('')}<h3>現役・冬眠モンスター</h3>${all.map(m=>`<div class="notice">${safe(m.name)} / 第${m.generation||1}世代 / ${safe(spec(m).name)} × ${safe(species.find(x=>x.id===m.subSpecies)?.name||spec(m).name)} / 合計${m.stats.reduce((a,b)=>a+b,0)} / ${m.battlesWon||0}勝</div>`).join('')||'なし'}<h3>歴代育成記録</h3>${records.slice().reverse().map(r=>`<div class="notice">${safe(r.name)} / 第${r.generation}世代 / ${r.age}週 / 合計${r.stats.reduce((a,b)=>a+b,0)} / ${safe(r.reason)}</div>`).join('')||'<p>まだ記録がありません。</p>'}<h3>探索発見</h3><p>${state.p4.discoveries.map(safe).join('、')||'未発見'}</p>`)}
function showRivals(){phase4Init();p4Modal('⚔️ ライバル育成者',`<p class="small muted">ライバルは練習試合で対戦可能。公式ランクに応じて能力が上がります。</p>${rivals.map((r,i)=>`<div class="notice"><b>${r.name}</b> / ${safe(species.find(s=>s.id===r.species).name)} / ${r.style}<br><small>勝利回数：${state.p4.rivalWins[r.name]||0}</small><p><button onclick="startRival(${i})" ${!state.monsters[state.active]?'disabled':''}>対戦する</button></p></div>`).join('')}`)}
function startRival(i){const r=rivals[i];closeModal();startBattle(false);if(!battle)return;battle.rivalName=r.name;const s=species.find(x=>x.id===r.species);battle.enemy.species=s.id;battle.enemy.name=r.name+'の'+s.name;const level=130+(state.battleData?.rank||0)*115+Math.floor(state.week/48)*10;battle.enemy.stats=s.growth.map(v=>clamp(Math.round(v*level),40,999));battle.ehp=battle.enemy.stats[0]+100;battle.maxehp=battle.ehp;showBattle()}
let reviewQuestion=null;
function showMathLab(){phase4Init();const m=state.monsters[state.active];const all=[...state.monsters,...state.frozen],mistakes=all.flatMap(x=>x.mathHistory||[]).filter(x=>!x.correct);const total=all.reduce((a,x)=>a+(x.mathHistory||[]).length,0);p4Modal('🧮 数学研究所・復習',`<p>記録された解答：${total}問 / 復習候補：${mistakes.length}問</p><p class="small muted">数学研究所で記録された解答から復習できます。復習は週を消費しません。</p><button onclick="beginReview()" ${!mistakes.length?'disabled':''}>間違えた問題を復習</button><h3>最近の問題</h3>${all.flatMap(x=>x.mathHistory||[]).slice(-12).reverse().map(q=>`<div class="notice">${safe(q.kind)}：${safe(q.txt)}　${q.correct?'✓ 正解':'✗ 不正解'}（答え ${q.ans}）</div>`).join('')||'<p>まだ解答記録がありません。</p>'}`)}
function beginReview(){const all=[...state.monsters,...state.frozen],mistakes=all.flatMap(x=>x.mathHistory||[]).filter(x=>!x.correct);if(!mistakes.length)return;reviewQuestion=mistakes[rand(0,mistakes.length-1)];modal(`<h2>🧮 復習問題</h2><div class="question">${safe(reviewQuestion.txt)}</div><form id="reviewForm"><input id="reviewAnswer" type="text" inputmode="text" required placeholder="数値を入力"><button type="button" onclick="insertMinus('reviewAnswer')">− マイナス</button><button type="submit">答える</button></form>`);document.getElementById('reviewForm').onsubmit=e=>{e.preventDefault();finishReview()}}
function finishReview(){if(!reviewQuestion)return;const f=document.getElementById('reviewAnswer'),n=parseMathNumber(f.value);if(!f.value.trim()||!Number.isFinite(n))return;const ok=Math.abs(n-reviewQuestion.ans)<1e-8;state.answers.total++;if(ok){state.answers.correct++;reviewQuestion.correct=true;state.money+=100}save();modal(`<h2>${ok?'正解！':'もう一度挑戦しよう'}</h2><p>正しい答え：${reviewQuestion.ans}</p><p>${ok?'復習成功！ 100Gを獲得しました。':'数学研究所で再挑戦できます。'}</p><button onclick="closeModal();render()">戻る</button>`);reviewQuestion=null}
// Facility work bonus: applied after normal job result, preserving all original logic.
const p4OriginalSubmit=submitAnswer;submitAnswer=function(){const m=state?.monsters[state.active];if(!m)return p4OriginalSubmit();phase4Init();const before=[...m.stats],wasPending=!!pending;const result=p4OriginalSubmit();if(wasPending&&state?.p4?.facilities.gym){let lv=state.p4.facilities.gym;for(let i=0;i<6;i++)if(m.stats[i]>before[i])m.stats[i]=clamp(m.stats[i]+lv*2,0,999);save()}return result};
</script></body></html>
