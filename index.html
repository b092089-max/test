function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function clamp(x,a,b){return Math.min(b,Math.max(a,x))}function spec(m){return species.find(s=>s.id===m.species)||species[0]}function growthAptitude(m){const main=spec(m).growth;const sub=species.find(s=>s.id===m.subSpecies);return sub?main.map((v,i)=>v*.8+sub.growth[i]*.2):main}function growthAptitudeForFusion(a,b){return spec(a).growth.map((v,i)=>v*.8+spec(b).growth[i]*.2)}function yearWeek(w){return `${Math.floor(w/48)+1}年 ${Math.floor((w%48)/4)+1}月 第${w%4+1}週`}function stage(m){let r=m.age/m.lifespan;return r<.15?'幼年期':r<.35?'成長期':r<.65?'最盛期':r<.82?'成熟期':'晩年期'}function condition(m){const burden=Math.max(m.fatigue,m.stress)*.65+(m.fatigue+m.stress)*.175;return burden>=85?'危険':burden>=65?'要休養':burden>=40?'やや疲れ':'元気'}function growth(m){let r=m.age/m.lifespan;return r<.15?.55:r<.35?1:r<.65?1.5:r<.82?.9:.5}function log(t){state.logs.unshift(`${yearWeek(state.week)}：${t}`);state.logs=state.logs.slice(0,35)}function save(show=false){if(state){try{localStorage.setItem(KEY,JSON.stringify(state));if(show)alert('保存しました。')}catch(e){alert('保存に失敗しました。バックアップを利用してください。')}}}function init(){try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&v.version===1&&Array.isArray(v.monsters)&&Number.isFinite(v.week)){state=v}}}catch(e){}render()}
// Birth-only lifespan compensation: 180 weeks => +150, 230 weeks => +0.
// Largest-remainder apportionment preserves the exact total without biasing stat order.
function birthStatBonus(s){
  const total=Math.max(0,Math.round(3*(230-s.life)));
  const sum=s.growth.reduce((a,b)=>a+b,0);
  const raw=s.growth.map(a=>total*a/sum);
  const bonus=raw.map(Math.floor);
  let remainder=total-bonus.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,fraction:v-Math.floor(v)}))
    .sort((a,b)=>b.fraction-a.fraction||a.i-b.i);
  for(let i=0;i<remainder;i++)bonus[order[i].i]++;
  return bonus;
}

function renderNextGoals(m){

 }

 if(m.age<48)html+=`<p class="small muted">🌱 成長の序盤：仕事を通じて得意能力を見つけよう。</p>`;

 else if(total>=1500)html+=`<p class="small muted">🔥 育成の中盤：修行で技を覚え、得意距離を伸ばそう。</p>`;

 ];

function battleDamage(attacker,defender,sk,attackerEN,defenderEN,critical){const t=speciesSkillStats(attacker,sk);const raw=((2.5*t.power+.30*attacker.stats[sk.kind])*100)/(100+.12*defender.stats[5]);return Math.max(1,Math.round(raw*gutsAttackMultiplier(attackerEN,attacker)*gutsDefenseMultiplier(defenderEN)*(critical?1.5:1)))}

function gutsTuning(monster){return gutsSpeciesTuning[monster?.species]||{regen:1,power:1,hit:1}}
function gutsRegen(current,base,monster){return Math.min(100,Math.round((current+base*gutsTuning(monster).regen)*1000)/1000)}

function enemyTurn(){
 if(!battle||battle.finished||battle.paused)return;
 const m=state.monsters[state.active],e=battle.enemy;
 // 敵もエナジーを消費する技を選ぶ。高ランクほど強い技を使いやすい。
 const pool=[
  {name:'けん制',cost:16,power:.78,accuracy:.08,cooldown:3},
  {name:'通常攻撃',cost:24,power:1,accuracy:0,cooldown:3},
  {name:'強打',cost:36,power:1.36,accuracy:-.10,cooldown:4},

 ];
 const available=pool.filter((sk,i)=>battle.eguts>=sk.cost&&(i<=Math.min(3,1+Math.floor(battle.rank/2))));
 if(!available.length)return; // エナジーがたまるまで待つ
 const pick=available[Math.floor(Math.random()*available.length)];
 const attackGuts=battle.eguts; // 技の消費前のエナジーで攻撃補正を確定
 battle.eguts-=pick.cost;
 battle.enemyCooldown=pick.cooldown;
 const chance=clamp(.65+(e.stats[3]-m.stats[4])/1600+pick.accuracy+gutsAccuracyBonus(attackGuts,e),.15,.95);
 if(Math.random()>chance){battleLog(`${e.name}の${pick.name}は外れた！`);return}
 const enemySkill={kind:1,power:Math.round(45*pick.power),accuracy:pick.accuracy*100,secret:true};const dmg=battleDamage(e,m,enemySkill,attackGuts,battle.guts,false);

  if(!el){el=document.createElement('div');el.id='mm-secret-notice';el.setAttribute('role','status');el.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2939;color:white;padding:12px 20px;border-radius:12px;z-index:99999;font-weight:bold;box-shadow:0 4px 20px #0005;pointer-events:none';document.body.appendChild(el)}
  el.textContent=message;
  clearTimeout(notice.hide);
  notice.hide=setTimeout(()=>{el.remove()},2000);
}
if(title){title.addEventListener('click',function(){
  const now=Date.now();
  if(now-lastTap>650)taps=0;
  lastTap=now;
  taps++;
  if(taps>=7){taps=0;enabled=!enabled;try{localStorage.setItem(MODE_KEY,enabled?'1':'0')}catch(e){}notice(enabled?'裏モード ON':'裏モード OFF')}
});}
function autoAnswer(fieldId,finish){
  if(!enabled||typeof question==='undefined'||!question||!Number.isFinite(question.ans))return;
  const field=document.getElementById(fieldId);
  if(!field)return;
  field.value=String(question.ans);
  finish();
}
function wrap(name,fieldId,finishName){
  const original=window[name];
  if(typeof original!=='function'||typeof window[finishName]!=='function')return;
  window[name]=function(...args){
    const result=original.apply(this,args);
    if(enabled)autoAnswer(fieldId,()=>window[finishName]());
    return result;
  };
}
wrap('beginJob','answer','submitAnswer');
wrap('useSkill','battleAnswer','answerBattle');
wrap('beginTraining','trainingAnswer','finishTraining');
wrap('beginExpedition','expeditionAnswer','finishExpedition');
})();

<script>
/* Measure actual nav height (including iOS safe area) rather than assuming a device size. */
(function(){
  function updateModalSpace(){
    const nav=document.querySelector('.mm-nav');
    const mobile=window.matchMedia('(max-width:760px)').matches;
    if(!mobile||!nav){document.documentElement.style.removeProperty('--mm-mobile-nav-height');return;}
    const box=nav.getBoundingClientRect();
    document.documentElement.style.setProperty('--mm-mobile-nav-height',Math.max(0,Math.ceil(window.innerHeight-box.top))+'px');
  }
  window.addEventListener('resize',updateModalSpace,{passive:true});
  window.addEventListener('orientationchange',updateModalSpace,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',updateModalSpace,{passive:true});
  const observer=new MutationObserver(updateModalSpace);
  observer.observe(document.getElementById('app'),{childList:true,subtree:false});
  updateModalSpace();
  window.addEventListener('load',updateModalSpace,{once:true});
})();
</script>

<script>
/* v1.2.9: battle hit chance and immediate condition refresh after using items. */
function mathmonBattleHitProbability(attacker, defender, skill, attackGuts) {
  const tuned=speciesSkillStats(attacker,skill);
  return clamp(
    .72+tuned.accuracy/100+
    (attacker.stats[3]-defender.stats[4])/1600+
    gutsAccuracyBonus(attackGuts,attacker),
    .15,.98
  );
}
(function(){
  'use strict';
  const previousShowBattle=window.showBattle;
  window.showBattle=function(...args){
    const result=previousShowBattle.apply(this,args);
    if(!battle||battle.finished||!state)return result;
    const m=state.monsters[state.active];
    const enemy=battle.enemy;
    const slots=skillSlots(m);
    const buttons=document.querySelectorAll('#modal .battlebuttons button');
    buttons.forEach((button,index)=>{
      const skillIndex=slots[index];
      if(skillIndex==null||!battleSkills[skillIndex])return;
      const skill=battleSkills[skillIndex];
      // answerBattle saves the pre-cost Guts in attackGuts, so the
      // displayed percentage must also use the pre-cost value.
      const chance=mathmonBattleHitProbability(m,enemy,skill,battle.guts);
      const percent=(chance*100).toFixed(1);
      const small=button.querySelector('small');
      if(small){
        small.innerHTML=small.innerHTML.replace(/命中[+-]?\d+(?=\s*\/|$)/,
          '命中率 <strong>'+percent+'%</strong>');
      }
    });
    return result;
  };

  const previousUseItem=window.useItem;
  window.useItem=function(...args){
    const result=previousUseItem.apply(this,args);
    // Item use does not advance the week. Refresh the farm's condition
    // indicators immediately while keeping the shop popup open.
    if(typeof window.render==='function')window.render();
    return result;
  };
})();
</script>
<script>
/* v1.2.7: Once-only, reload-safe end-of-life farewell. */
(function(){
 const priorArchive=window.archive;
 window.archive=function(reason){
   const m=state?.monsters?.[state.active];
   if(m&&reason==='寿命を迎えた'){
     const cup=m.cup||m.championsCup||{};
     const rec={name:m.name,species:spec(m).name,icon:spec(m).icon,
       age:m.age,stats:[...m.stats],total:m.stats.reduce((a,b)=>a+b,0),
       generation:m.generation||1,wins:m.battlesWon||0,
       achievements:Array.isArray(m.achievements)?[...m.achievements]:[],
       cupWins:cup.wins||0};
     state.pendingFarewell=rec;
   }
   return priorArchive.apply(this,arguments);
 };
 const priorRender=window.render;
 window.render=function(){
   const result=priorRender.apply(this,arguments);
   if(state?.pendingFarewell)showLifeFarewell();
   return result;
 };
 window.showLifeFarewell=function(){
   const r=state?.pendingFarewell;if(!r)return;
   const top=r.stats.map((v,i)=>({label:names[i],value:v})).sort((a,b)=>b.value-a.value).slice(0,3);
   const years=Math.floor(r.age/48),months=Math.floor((r.age%48)/4);
   const honors=r.achievements.length?r.achievements.map(x=>safe(x)).join('・'):'これからも記録に残る大切な仲間';
   modal(`<div style="text-align:center;padding:8px 0 14px">
      <div style="font-size:58px;line-height:1.3">🌠 ${safe(r.icon)}</div>
      <h2>ありがとう、${safe(r.name)}</h2>
      <p>${safe(r.name)}は長い育成の日々を終え、静かに寿命を迎えました。</p>
      <p class="muted">ともに過ごした時間と、残した記録はファームの歴史に刻まれます。</p>
     </div>
     <div class="notice"><b>🌟 最後の育成記録</b><br>
       ${safe(r.species)} / 第${r.generation}世代<br>
       育成年齢：${years}歳${months}か月（${r.age}週）<br>
       最終能力合計：<b>${r.total}</b><br>
       得意な能力：${top.map(x=>safe(x.label)+' '+x.value).join(' / ')}<br>
       勝利数：${r.wins}回${r.cupWins?' / チャンピオンズカップ '+r.cupWins+'勝':''}<br>
       大会実績：${honors}
     </div>
     <p style="text-align:center">${safe(r.name)}、本当にお疲れさま。<br>たくさんの思い出をありがとう。</p>
     <button style="width:100%" onclick="finishLifeFarewell()">思い出を胸に、次へ進む</button>`);
 };
 window.finishLifeFarewell=function(){
   if(!state?.pendingFarewell)return;
   delete state.pendingFarewell;
   save();closeModal();render();
 };
 // The farewell remains available after a reload until acknowledged.
 const priorInit=window.init;
 window.init=function(){const result=priorInit.apply(this,arguments);if(state?.pendingFarewell)showLifeFarewell();return result;};
})();
</script>
